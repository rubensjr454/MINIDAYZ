    const ang = pl.angle || 0;

    if (cam.zoom < ISLAND_ZOOM) {
      const halo = ctx.createRadialGradient(ps.x, ps.y, 6, ps.x, ps.y, 40);
      halo.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      halo.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(ps.x, ps.y, 40, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(ps.x, ps.y, 16 + pulse * 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.85 - pulse * 0.6).toFixed(3) + ')';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(ps.x, ps.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 60, -0.5, 0.5);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(21, 0);
    ctx.lineTo(-14, 13.5);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-14, -13.5);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#0b1210';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();
  }

  function drawOffscreenPlayer(pl, vw, vh) {
    offscreenHit = null;
    const ps = worldToScreen(pl.x, pl.y);
    const top = hudBottom + 8;
    const bottom = Math.min(vh, drawerTop || vh) - 8;
    if (ps.x >= 0 && ps.x <= vw && ps.y >= top && ps.y <= bottom) return;

    const cx = vw * 0.5;
    const cy = (top + bottom) * 0.5;
    const dx = ps.x - cx;
    const dy = ps.y - cy;
    const m = 30;
    const sx = Math.abs(dx) > 0.001 ? ((vw * 0.5 - m) / Math.abs(dx)) : Infinity;
    const sy = Math.abs(dy) > 0.001 ? (((bottom - top) * 0.5 - m) / Math.abs(dy)) : Infinity;
    const k = Math.min(sx, sy);
    const ex = cx + dx * k;
    const ey = cy + dy * k;
    const ang = Math.atan2(dy, dx);
    const c = screenToWorld(vw * 0.5, vh * 0.5);
    const txt = fmtDist(Math.hypot(pl.x - c.x, pl.y - c.y) / PX_PER_METER);

    ctx.beginPath();
    ctx.arc(ex, ey, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(11, 16, 13, 0.92)';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(27, 0);
    ctx.lineTo(19, -6);
    ctx.lineTo(19, 6);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    ctx.font = 'bold 10px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(txt, ex, ey + 0.5);
    offscreenHit = { x: ex, y: ey, r: 26 };
  }

  function drawCompass(vw, vh) {
    const cx = vw - 34;
    const cy = Math.min(vh, drawerTop || vh) - 34;
    ctx.beginPath();
    ctx.arc(cx, cy, 19, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(11, 16, 13, 0.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(232, 239, 226, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy - 14);
    ctx.lineTo(cx + 5, cy);
    ctx.lineTo(cx - 5, cy);
    ctx.closePath();
    ctx.fillStyle = '#ff5252';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy + 14);
    ctx.lineTo(cx + 5, cy);
    ctx.lineTo(cx - 5, cy);
    ctx.closePath();
    ctx.fillStyle = '#e8efe2';
    ctx.fill();
    ctx.font = 'bold 10px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(8, 12, 10, 0.9)';
    ctx.strokeText('N', cx, cy - 26);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('N', cx, cy - 26);
  }

  function drawScaleBar(vw, vh) {
    const steps = [10, 25, 50, 100, 200, 500, 1000, 2000, 5000];
    const pxPerM = PX_PER_METER * cam.zoom;
    let meters = steps[steps.length - 1];
    for (let i = 0; i < steps.length; i++) {
      if (steps[i] * pxPerM >= 60) { meters = steps[i]; break; }
    }
    const w = Math.round(meters * pxPerM);
    const x = 40;
    const y = Math.min(vh, drawerTop || vh) - 18;
    ctx.fillStyle = 'rgba(11, 16, 13, 0.78)';
    ctx.fillRect(x - 6, y - 16, w + 12, 26);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x, y + 3);
    ctx.lineTo(x + w, y + 3);
    ctx.lineTo(x + w, y - 4);
    ctx.stroke();
    ctx.font = 'bold 10px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fmtDist(meters), x + w / 2, y - 8);
  }

  function renderFrame() {
    const vw = window.innerWidth - panelW;
    const vh = window.innerHeight;

    ctx.fillStyle = THEME.sea;
    ctx.fillRect(0, 0, window.innerWidth, vh);

    if (!cam.follow && tickData && tickData.player && Date.now() - lastInteract > AUTO_RECENTER_MS) {
      setFollow(true);
    }
    if (cam.follow && tickData && tickData.player) {
      const fdx = tickData.player.x - cam.x;
      const fdy = tickData.player.y - cam.y;
      cam.x += fdx * 0.22;
      cam.y += fdy * 0.22;
      if (Math.abs(fdx) * cam.zoom > 0.3 || Math.abs(fdy) * cam.zoom > 0.3) dirty = true;
    }

    // 1. Blit único da Visão de Satélite em cache (0% overhead de CPU!)
    if (mapData && staticLayer.width > 0) {
      let tl = worldToScreen(0, 0);
      let dw = mapData.width * cam.zoom;
      let dh = mapData.height * cam.zoom;
      const detailA = Math.max(0, Math.min(1, (cam.zoom - DETAIL_ZOOM_LO) / (DETAIL_ZOOM_HI - DETAIL_ZOOM_LO)));
      ctx.imageSmoothingEnabled = cam.zoom < 0.45;
      if (detailA < 1) ctx.drawImage(overviewLayer, tl.x, tl.y, dw, dh);
      if (detailA > 0) {
        ctx.globalAlpha = detailA;
        ctx.drawImage(staticLayer, tl.x, tl.y, dw, dh);
        ctx.globalAlpha = 1;
      }
      drawOverviewRoads(1 - detailA);
      drawGridLines(vw, vh);
      drawTrail();
    }

    let pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
    let labelQueue = [];
    interactiveTargets = [];

    function registerInteractive(wx, wy, sx, sy, label, color, badge, prio) {
      if (sx < -30 || sy < -30 || sx > vw + 30 || sy > vh + 30) return;
      let item = { x: wx, y: wy, sx: sx, sy: sy, label: label, color: color, badge: badge, prio: prio };
      interactiveTargets.push(item);

      let isFocused = isSameTarget(item, selectedPoi) || isSameTarget(item, hoveredPoi);
      if (isFocused) {
        // Anel de inspeção no ícone selecionado/focado
        ctx.beginPath();
        ctx.arc(sx, sy, 13, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        let dTxt = '';
        if (tickData && tickData.player) {
          dTxt = ' • ' + Math.round(Math.hypot(wx - tickData.player.x, wy - tickData.player.y) / PX_PER_METER) + 'm';
        }
        labelQueue.push({
          sx: sx,
          sy: sy,
          text: label + ' [' + sectorLabel(wx, wy) + ']' + dTxt,
          color: color,
          prio: 0,
          force: true
        });
      } else if (cam.zoom >= LABEL_ZOOM_THRESHOLD) {
        labelQueue.push({
          sx: sx,
          sy: sy,
          text: label,
          color: color,
          prio: prio,
          force: false
        });
      }
    }

    // 2-5. Ícones de mapa com LOD por zoom + agrupamento por tipo
    const essentialOnly = cam.zoom < ISLAND_ZOOM;
    const iconItems = [];
    const addIcon = function (type, wx, wy, label) {
      const st = ICON_STYLE[type];
      if (!st || (st.minZoom && cam.zoom < st.minZoom)) return;
      if (essentialOnly && !st.essential) return;
      const s = worldToScreen(wx, wy);
      if (s.x < -30 || s.y < -30 || s.x > vw + 30 || s.y > vh + 30) return;
      iconItems.push({ type: type, x: wx, y: wy, sx: s.x, sy: s.y, label: label || st.name });
    };

    if (filters.landmarks) {
      for (let li = 0; li < landmarks.length; li++) addIcon(landmarks[li].kind, landmarks[li].x, landmarks[li].y, landmarks[li].label);
    }
    if (filters.crashes) {
      const crashes = (mapData && mapData.crashes) || [];
      for (let ci = 0; ci < crashes.length; ci++) addIcon('heli', crashes[ci].x, crashes[ci].y, crashes[ci].label);
      const tents = (tickData && tickData.tents) || [];
      for (let ti = 0; ti < tents.length; ti++) addIcon('tent', tents[ti].x, tents[ti].y, tents[ti].label);
      const vehicles = (tickData && tickData.vehicles) || [];
      for (let vi = 0; vi < vehicles.length; vi++) addIcon('vehicle', vehicles[vi].x, vehicles[vi].y, vehicles[vi].label);
    }
    if (filters.secrets && mapData) {
      const secrets = mapData.secrets || [];
      for (let si = 0; si < secrets.length; si++) addIcon('secret', secrets[si].x, secrets[si].y, secrets[si].label);
      const bunkers = mapData.bunkers || [];
      for (let bi = 0; bi < bunkers.length; bi++) addIcon('bunker', bunkers[bi].x, bunkers[bi].y, bunkers[bi].label);
    }
    if (filters.threats && !essentialOnly && tickData && tickData.player) {
      const ps0 = worldToScreen(tickData.player.x, tickData.player.y);
      ctx.beginPath();
      ctx.arc(ps0.x, ps0.y, 2600 * cam.zoom, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 82, 82, 0.28)';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.setLineDash([]);
      const threats = tickData.threats || [];
      for (let ei = 0; ei < threats.length; ei++) {
        const th = threats[ei];
        const tk = th.kind === 'wolf' ? 'special' : (ICON_STYLE[th.kind] ? th.kind : 'zed');
        addIcon(tk, th.x, th.y, th.label);
      }
    }

    const clusters = clusterIcons(iconItems);
    for (let k = 0; k < clusters.length; k++) {
      const it = clusters[k];
      const st = ICON_STYLE[it.type];
      const r = st.essential ? 8.5 : 7;
      if (st.pulse) {
        ctx.beginPath();
        ctx.arc(it.sx, it.sy, r + 4 + pulse * 4, 0, Math.PI * 2);
        ctx.strokeStyle = st.color;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      drawIcon(it.type, it.sx, it.sy, r);
      if (it.count > 1) drawCountBadge(it.sx, it.sy, it.count);
      registerInteractive(it.x, it.y, it.sx, it.sy, it.count > 1 ? st.name + ' ×' + it.count : it.label, st.color, '', st.prio || 4);
    }
    // 5.5. Missões & Sobreviventes Neutros (NPC Quest Giver & Itens Solicitados)
    if (filters.quests && tickData && tickData.quest) {
      let qst = tickData.quest;
      let gList = qst.givers || (qst.giver ? [qst.giver] : []);

      // A) Marcador dedicado para o NPC de Missão (Sobrevivente Neutro / Trader)
      for (let qi = 0; qi < gList.length; qi++) {
        let gv = gList[qi];
        let gvS = worldToScreen(gv.x, gv.y);

        let isDone = qst.status === 4;
        let isActive = qst.status === 2;
        let isOffered = qst.status === 1;

        let qRingCol = isDone ? 'rgba(118, 255, 3, 0.85)' : (isActive ? 'rgba(77, 208, 225, 0.85)' : 'rgba(77, 208, 225, 0.55)');
        let qFillCol = isDone ? '#76ff03' : (isActive ? '#4dd0e1' : '#26c6da');
        let qIcon = isDone ? '✓' : (isActive ? '!' : '?');

        ctx.beginPath();
        ctx.arc(gvS.x, gvS.y, 11 + pulse * 4, 0, Math.PI * 2);
        ctx.strokeStyle = qRingCol;
        ctx.lineWidth = 2.2;
        ctx.stroke();

        drawIcon('quest', gvS.x, gvS.y, 8, qIcon);
        if (isDone) {
          ctx.beginPath();
          ctx.arc(gvS.x, gvS.y, 8, 0, Math.PI * 2);
          ctx.strokeStyle = qFillCol;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        let qLabel = gv.name || 'Sobrevivente Neutro';
        if (isDone) {
          qLabel = 'Sobrevivente (Entregar: ' + (qst.itemName || 'Missão') + '!)';
        } else if (isActive) {
          qLabel = 'Sobrevivente (' + (qst.taskTitle || 'Missão Ativa') + ')';
        } else if (isOffered) {
          qLabel = 'Sobrevivente (Missão Disponível)';
        }

        registerInteractive(gv.x, gv.y, gvS.x, gvS.y, qLabel, '#4dd0e1', '', 1);

        if (cam.zoom >= LANDMARK_BADGE_ZOOM || isActive || isDone) {
          labelQueue.push({
            sx: gvS.x,
            sy: gvS.y,
            text: qLabel,
            color: isDone ? '#76ff03' : '#4dd0e1',
            prio: 1,
            force: isActive || isDone
          });
        }
      }

      // B) Itens da Missão no chão (marcador pulsante roxo/dourado com linha pontilhada até ele)
      let itList = qst.items || [];
      for (let iti = 0; iti < itList.length; iti++) {
        let it = itList[iti];
        let its = worldToScreen(it.x, it.y);

        ctx.beginPath();
        ctx.arc(its.x, its.y, 12 + pulse * 4.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(77, 208, 225, 0.85)';
        ctx.lineWidth = 2.2;
        ctx.stroke();
        drawIcon('qitem', its.x, its.y, 8);

        if (tickData.player) {
          let pItem = worldToScreen(tickData.player.x, tickData.player.y);
          ctx.beginPath();
          ctx.moveTo(pItem.x, pItem.y);
          ctx.lineTo(its.x, its.y);
          ctx.strokeStyle = 'rgba(77, 208, 225, 0.85)';
          ctx.setLineDash([7, 5]);
          ctx.lineWidth = 2.2;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        let itLabel = (it.name || qst.itemName || 'Item da Missão') + (tickData.player ? ' • ' + distBearingText(tickData.player.x, tickData.player.y, it.x, it.y) : '');
        registerInteractive(it.x, it.y, its.x, its.y, 'Item da Missão: ' + (it.name || qst.itemName), '#4dd0e1', '', 0);

        labelQueue.push({
          sx: its.x,
          sy: its.y,
          text: itLabel,
          color: '#4dd0e1',
          prio: 0,
          force: true
        });
      }

      // C) Alvo Fixo da Missão (Bandidos, Maleta, Crate, Boss)
      let qTgt = qst.target || tickData.quest_target;
      if (qTgt && typeof qTgt.x === 'number' && typeof qTgt.y === 'number') {
        let tgts = worldToScreen(qTgt.x, qTgt.y);
        ctx.beginPath();
        ctx.arc(tgts.x, tgts.y, 14 + pulse * 5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 82, 82, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
        drawIcon('target', tgts.x, tgts.y, 8);

        if (tickData.player) {
          let pTgt = worldToScreen(tickData.player.x, tickData.player.y);
          ctx.beginPath();
          ctx.moveTo(pTgt.x, pTgt.y);
          ctx.lineTo(tgts.x, tgts.y);
          ctx.strokeStyle = 'rgba(255, 82, 82, 0.85)';
          ctx.setLineDash([8, 6]);
          ctx.lineWidth = 2.2;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        let tgtLabel = (qTgt.label || 'Alvo da Missão') + (tickData.player ? ' • ' + distBearingText(tickData.player.x, tickData.player.y, qTgt.x, qTgt.y) : '');
        registerInteractive(qTgt.x, qTgt.y, tgts.x, tgts.y, tgtLabel, '#ff5252', '', 0);
        labelQueue.push({ sx: tgts.x, sy: tgts.y, text: tgtLabel, color: '#ff5252', prio: 0, force: true });
      }
    }

    drawPlaceNames(vw, vh);

    // 6. Waypoint Tático Sincronizado com o PC (sempre exibe distância em metros)
    if (waypoint) {
      let ws = worldToScreen(waypoint.x, waypoint.y);
      let wpLabel = 'WP [' + sectorLabel(waypoint.x, waypoint.y) + ']';

      if (tickData && tickData.player) {
        let p0 = tickData.player;
        let psLine = worldToScreen(p0.x, p0.y);
        wpLabel = 'WP • ' + distBearingText(p0.x, p0.y, waypoint.x, waypoint.y);

        ctx.beginPath();
        ctx.moveTo(psLine.x, psLine.y);
        ctx.lineTo(ws.x, ws.y);
        ctx.strokeStyle = 'rgba(77, 208, 225, 0.82)';
        ctx.setLineDash([7, 5]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.beginPath();
      ctx.arc(ws.x, ws.y, 9 + pulse * 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#4dd0e1';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(ws.x, ws.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd54f';
      ctx.fill();

      labelQueue.push({
        sx: ws.x,
        sy: ws.y,
        text: wpLabel,
        color: '#4dd0e1',
        prio: 0,
        force: true
      });
    }

    // 7. Jogador em Tempo Real + Cone de Visão
    if (tickData && tickData.player) {
      drawPlayer(tickData.player, pulse);
    }

    // 8. Desenha Rótulos Ordenados por Prioridade e Sem Sobreposição
    if (labelQueue.length) {
      labelQueue.sort(function (a, b) { return (b.force - a.force) || (a.prio - b.prio); });
      let placedRects = [];
      for (let lqi = 0; lqi < labelQueue.length; lqi++) {
        let lq = labelQueue[lqi];
        tryDrawLabelBox(lq.sx, lq.sy, lq.text, lq.color, placedRects, lq.force);
      }
    }

    // 9. Réguas laterais de coordenadas (A..P / 1..16)
    drawStickyGridRulers(vw, vh);
    drawCompass(vw, vh);
    drawScaleBar(vw, vh);
    if (tickData && tickData.player) drawOffscreenPlayer(tickData.player, vw, vh);
    else offscreenHit = null;

    positionPoiCard();
  }

  // Dirty flag: redesenha ao mudar algo; senão só o pulso a ~18 FPS
  const PULSE_FRAME_MS = 55;
  let dirty = true;
  let lastDraw = 0;

  function invalidate() {
    dirty = true;
  }

  function renderLoop(ts) {
    window.requestAnimationFrame(renderLoop);
    if (!dirty && ts - lastDraw < PULSE_FRAME_MS) return;
    dirty = false;
    lastDraw = ts;
    renderFrame();
  }

  ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'click', 'change'].forEach(function (ev) {
    document.addEventListener(ev, invalidate, { capture: true, passive: true });
  });
  window.addEventListener('resize', invalidate);

  // =========================================================================
  // INTERAÇÃO TÁTICA: HOVER, TOQUE EM ÍCONES, PINCH-TO-ZOOM E WAYPOINT
  // =========================================================================
  var pointers = {};
  var lastPinchDist = 0;
  var dragStart = null;
  var movedDuringTouch = false;

  function findNearestTarget(sx, sy, maxRadiusPx) {
    var best = null;
    var bestD2 = maxRadiusPx * maxRadiusPx;
    for (var i = 0; i < interactiveTargets.length; i++) {
      var t = interactiveTargets[i];
      var dx = t.sx - sx;
      var dy = t.sy - sy;
      var d2 = dx * dx + dy * dy;
      if (d2 <= bestD2) {
        bestD2 = d2;
        best = t;
      }
    }
    return best;
  }

  function setFollow(state) {
    cam.follow = state;
    btnFollow.classList.toggle('active', state);
  }

  function sendWaypoint(wx, wy, clear) {
    if (DEMO) return;
    var body = clear ? { clear: true } : { x: Math.round(wx), y: Math.round(wy) };
    fetch('/waypoint?t=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(function () {});
  }

  function placeWaypointAt(wx, wy) {
    if (!mapData) return;
    if (wx < 0 || wy < 0 || wx > mapData.width || wy > mapData.height) return;
    waypoint = { x: Math.round(wx), y: Math.round(wy) };
    updateHudText();
    sendWaypoint(waypoint.x, waypoint.y, false);
  }

  canvas.addEventListener('pointerdown', function (e) {
    markInteract();
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);
    if (ids.length === 1) {
      dragStart = { x: e.clientX, y: e.clientY, camX: cam.x, camY: cam.y, time: Date.now() };
      movedDuringTouch = false;
      startLongPress(e.clientX, e.clientY);
    } else if (ids.length === 2) {
      cancelLongPress();
      var p1 = pointers[ids[0]];
      var p2 = pointers[ids[1]];
      lastPinchDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      movedDuringTouch = true;
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    // Hover de mouse em 2º monitor exibe o rótulo instantaneamente sem precisar dar zoom
    if (e.pointerType === 'mouse' && Object.keys(pointers).length === 0) {
      var hit = findNearestTarget(e.clientX, e.clientY, 22);
      var changed = !isSameTarget(hit, hoveredPoi) && (hit !== hoveredPoi);
      hoveredPoi = hit;
      canvas.style.cursor = hit ? 'pointer' : 'grab';
      if (changed) updatePoiCard();
      return;
    }

    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pointers);

    if (ids.length === 1 && dragStart) {
      var dx = e.clientX - dragStart.x;
      var dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 8) {
        movedDuringTouch = true;
        cancelLongPress();
        setFollow(false);
        cam.x = dragStart.camX - dx / cam.zoom;
        cam.y = dragStart.camY - dy / cam.zoom;
      }
    } else if (ids.length === 2) {
      var p1 = pointers[ids[0]];
      var p2 = pointers[ids[1]];
      var dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (lastPinchDist > 10 && dist > 10) {
        var midX = (p1.x + p2.x) * 0.5;
        var midY = (p1.y + p2.y) * 0.5;
        var before = screenToWorld(midX, midY);
        cam.zoom = Math.max(0.012, Math.min(0.85, cam.zoom * (dist / lastPinchDist)));
        var after = screenToWorld(midX, midY);
        cam.x += (before.x - after.x);
        cam.y += (before.y - after.y);
      }
      lastPinchDist = dist;
    }
  });

  var LONG_PRESS_MS = 450;
  var DOUBLE_TAP_MS = 320;
  var longPressTimer = 0;
  var longPressFired = false;
  var lastTap = null;

  function cancelLongPress() {
    if (longPressTimer) {
      window.clearTimeout(longPressTimer);
      longPressTimer = 0;
    }
  }

  function waypointAtScreen(sx, sy) {
    if (!filters.waypointTap || !mapData) return;
    const hit = findNearestTarget(sx, sy, 26);
    if (hit) {
      placeWaypointAt(hit.x, hit.y);
    } else {
      const w = screenToWorld(sx, sy);
      placeWaypointAt(w.x, w.y);
    }
  }

  function startLongPress(sx, sy) {
    cancelLongPress();
    longPressFired = false;
    longPressTimer = window.setTimeout(function () {
      longPressTimer = 0;
      if (movedDuringTouch || Object.keys(pointers).length !== 1) return;
      longPressFired = true;
      lastTap = null;
      waypointAtScreen(sx, sy);
    }, LONG_PRESS_MS);
  }

  function onPointerRelease(e) {
    const wasSingle = Object.keys(pointers).length === 1;
    delete pointers[e.pointerId];
    lastPinchDist = 0;
    cancelLongPress();

    if (wasSingle && dragStart && !movedDuringTouch && !longPressFired && e.type === 'pointerup' && (Date.now() - dragStart.time) < LONG_PRESS_MS) {
      const now = Date.now();
      if (offscreenHit && Math.hypot(e.clientX - offscreenHit.x, e.clientY - offscreenHit.y) <= offscreenHit.r) {
        lastTap = null;
        centerOnPlayer();
      } else if (lastTap && now - lastTap.t < DOUBLE_TAP_MS && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 24) {
        lastTap = null;
        waypointAtScreen(e.clientX, e.clientY);
      } else {
        lastTap = { t: now, x: e.clientX, y: e.clientY };
        selectedPoi = findNearestTarget(e.clientX, e.clientY, 26);
        updatePoiCard();
      }
    }
    longPressFired = false;
    if (Object.keys(pointers).length === 0) dragStart = null;
  }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerup', onPointerRelease);
  canvas.addEventListener('pointercancel', onPointerRelease);

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    markInteract();
    var before = screenToWorld(e.clientX, e.clientY);
    var factor = e.deltaY < 0 ? 1.18 : 0.85;
    cam.zoom = Math.max(0.012, Math.min(0.85, cam.zoom * factor));
    var after = screenToWorld(e.clientX, e.clientY);
    cam.x += (before.x - after.x);
    cam.y += (before.y - after.y);
  }, { passive: false });

  // Botões da UI
  function centerOnPlayer() {
    markInteract();
    setFollow(true);
    if (tickData && tickData.player) {
      cam.x = tickData.player.x;
      cam.y = tickData.player.y;
    }
  }

  btnFollow.addEventListener('click', centerOnPlayer);
  document.getElementById('btn-fit').addEventListener('click', function () {
    markInteract();
    setFollow(false);
    fitIsland();
  });
  document.getElementById('btn-zoom-in').addEventListener('click', function () {
    markInteract();
    cam.zoom = Math.min(0.85, cam.zoom * 1.35);
  });
  document.getElementById('btn-zoom-out').addEventListener('click', function () {
    markInteract();
    cam.zoom = Math.max(0.012, cam.zoom / 1.35);
  });
  btnClearWp.addEventListener('click', function () {
    waypoint = null;
    updateHudText();
    sendWaypoint(0, 0, true);
  });

  document.getElementById('btn-poi-wp').addEventListener('click', function () {
    var active = selectedPoi || hoveredPoi;
    if (active) placeWaypointAt(active.x, active.y);
  });
  document.getElementById('btn-poi-center').addEventListener('click', function () {
    const active = selectedPoi || hoveredPoi;
    if (!active) return;
    markInteract();
    setFollow(false);
    cam.x = active.x;
    cam.y = active.y;
    if (cam.zoom < ISLAND_ZOOM) cam.zoom = 0.095;
  });
  document.getElementById('btn-poi-close').addEventListener('click', function () {
    selectedPoi = null;
    hoveredPoi = null;
    updatePoiCard();
  });

  document.getElementById('drawer-head').addEventListener('click', function () {
    var col = drawer.classList.toggle('collapsed');
    drawerToggleLbl.textContent = col ? '[Expandir ▲]' : '[Recolher ▼]';
    measureChrome();
  });

  function buildLegend() {
    const box = document.getElementById('legend');
    if (!box) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    Object.keys(ICON_STYLE).forEach(function (key) {
      const st = ICON_STYLE[key];
      if (!st.legend) return;
      const row = document.createElement('span');
      row.className = 'lg-item';
      const cv = document.createElement('canvas');
      cv.width = 20 * dpr;
      cv.height = 20 * dpr;
      const c = cv.getContext('2d');
      c.scale(dpr, dpr);
      drawIconShape(c, key, 10, 10, 6.5);
      const txt = document.createElement('span');
      txt.textContent = st.name;
      row.appendChild(cv);
      row.appendChild(txt);
      box.appendChild(row);
    });
  }
  buildLegend();

  document.getElementById('btn-legend').addEventListener('click', function () {
    const box = document.getElementById('legend');
    const hidden = box.classList.toggle('hidden');
    this.textContent = hidden ? 'Legenda ▸' : 'Legenda ▾';
    measureChrome();
  });

  const FILTER_KEYS = ['secrets', 'crashes', 'landmarks', 'threats', 'quests'];
  let essentialMode = false;
  document.getElementById('btn-essential').addEventListener('click', function () {
    essentialMode = !essentialMode;
    const on = { secrets: true, quests: true, crashes: !essentialMode, landmarks: !essentialMode, threats: !essentialMode };
    FILTER_KEYS.forEach(function (k) {
      filters[k] = on[k];
      document.getElementById('flt-' + k).checked = on[k];
    });
    this.classList.toggle('active', essentialMode);
    this.textContent = essentialMode ? 'Mostrar tudo' : 'Só essencial';
  });

  function updateFilterCounts() {
    const q = tickData && tickData.quest;
    const counts = {
      secrets: mapData ? ((mapData.secrets || []).length + (mapData.bunkers || []).length) : 0,
      crashes: ((mapData && mapData.crashes) || []).length + ((tickData && tickData.tents) || []).length + ((tickData && tickData.vehicles) || []).length,
      landmarks: landmarks.length,
      threats: ((tickData && tickData.threats) || []).length,
      quests: q ? ((q.givers || (q.giver ? [q.giver] : [])).length + (q.items || []).length + (q.target ? 1 : 0)) : 0
    };
    FILTER_KEYS.forEach(function (k) {
      const el = document.getElementById('cnt-' + k);
      if (el) el.textContent = '(' + counts[k] + ')';
    });
  }

  document.getElementById('flt-secrets').addEventListener('change', function (e) { filters.secrets = e.target.checked; });
  document.getElementById('flt-crashes').addEventListener('change', function (e) { filters.crashes = e.target.checked; });
  document.getElementById('flt-landmarks').addEventListener('change', function (e) { filters.landmarks = e.target.checked; });
  document.getElementById('flt-threats').addEventListener('change', function (e) { filters.threats = e.target.checked; });
  document.getElementById('flt-quests').addEventListener('change', function (e) { filters.quests = e.target.checked; });
  document.getElementById('flt-waypoint').addEventListener('change', function (e) { filters.waypointTap = e.target.checked; });

  // =========================================================================
  // STREAMING SSE LEVE + HIDRATAÇÃO INICIAL (/state + /events)
  // =========================================================================
  var resyncHash = '';
  var resyncAt = 0;

  function isMapStale() {
    return !!(tickData && tickData.mapHash && mapData && !mapData.isFallback && mapData.mapHash && tickData.mapHash !== mapData.mapHash);
  }

  function applyMapInit(data) {
    if (!data) return;
    var firstLoad = !mapData || mapData.isFallback || (mapData.mapHash || '') !== (data.mapHash || '') || mapData.layout !== data.layout;
    mapData = data;
    if (firstLoad) trail = [];
    buildPlaceNames(data);
    if (typeof staticCtx !== 'undefined' && staticCtx && typeof staticLayer !== 'undefined' && staticLayer) {
      staticCtx.clearRect(0, 0, staticLayer.width, staticLayer.height);
    }
    landmarks = [];
    tileSliceCache = {};
    buildLandmarksIndex(data);
    ensureMapTextures(data);
    rebuildVector();
    bakeStaticMap();

    if (!cam.initialized || firstLoad) {
      cam.initialized = true;
      fitIsland();
      if (tickData && tickData.player) {
        cam.x = tickData.player.x;
        cam.y = tickData.player.y;
        cam.zoom = 0.095;
      }
    }
    updateHudText();
  }

  function applyMapDelta(delta) {
    if (!delta || !mapData || mapData.isFallback) return;
    mapData.images = mapData.images || [];
    mapData.sprites = mapData.sprites || [];
    mapData.tilemaps = mapData.tilemaps || [];
    mapData.buildings = mapData.buildings || [];

    var imgRemap = {};
    var dImgs = delta.images || [];
    for (var i = 0; i < dImgs.length; i++) {
      var fn = dImgs[i];
      var idx = mapData.images.indexOf(fn);
      if (idx < 0) {
        idx = mapData.images.length;
        mapData.images.push(fn);
      }
      imgRemap[i] = idx;
    }

    var sprRemap = {};
    var dSprs = delta.sprites || [];
    for (var s = 0; s < dSprs.length; s++) {
      var sp = dSprs[s];
      var mappedImg = imgRemap[sp[0]] !== undefined ? imgRemap[sp[0]] : sp[0];
      var newIdx = mapData.sprites.length;
      mapData.sprites.push([mappedImg, sp[1], sp[2], sp[3], sp[4], sp[5], sp[6]]);
      sprRemap[s] = newIdx;
    }

    const newTms = [];
    var dTms = delta.tilemaps || [];
    for (var t = 0; t < dTms.length; t++) {
      var tm = dTms[t].slice();
      tm[0] = imgRemap[tm[0]] !== undefined ? imgRemap[tm[0]] : tm[0];
      mapData.tilemaps.push(tm);
      newTms.push(tm);
    }

    const newBlds = [];
    const bIdx = buildingIndex();
    var dBlds = delta.buildings || [];
    for (var b = 0; b < dBlds.length; b++) {
      var nb = dBlds[b].slice();
      if (nb[6] >= 0 && sprRemap[nb[6]] !== undefined) nb[6] = sprRemap[nb[6]];
      const at = findNearBuilding(bIdx, nb[0], nb[1]);
      if (at >= 0) {
        mapData.buildings[at] = nb;
      } else {
        bIdx.set(buildingKey(nb[0], nb[1]), mapData.buildings.length);
        mapData.buildings.push(nb);
      }
      newBlds.push(nb);
    }

    ensureMapTextures(mapData);
    buildLandmarksIndex(mapData);
    bakeDelta(newTms, newBlds);
    scheduleOverviewDelta();
  }

  function applyTick(data) {
    if (!data) return;
    var hadTick = !!tickData;
    // Ilha nova: o rastro da ilha antiga nao pode ligar com o ponto novo.
    if (mapData && !mapData.isFallback && mapData.mapHash && data.mapHash && data.mapHash !== mapData.mapHash) trail = [];
    tickData = data;
    pushTrail(data.player);

    if (!mapData && data.mapWidth && data.mapHeight) {
      mapData = {
        isFallback: true,
        layout: data.layout || 'Map',
        width: data.mapWidth,
        height: data.mapHeight,
        island: typeof data.island === 'number' ? data.island : 1,
        buildings: [],
        secrets: [],
        crashes: [],
        bunkers: []
      };
      rebuildVector();
      bakeStaticMap();
      fitIsland();
      fetchStateSnapshot();
    }

    if (isMapStale()) {
      var now = Date.now();
      if (resyncHash !== data.mapHash || now - resyncAt > 3000) {
        resyncHash = data.mapHash;
        resyncAt = now;
        fetchStateSnapshot();
      }
    }

    if (!hadTick && data.player && cam.follow) {
      cam.x = data.player.x;
      cam.y = data.player.y;
      if (cam.zoom < 0.06) cam.zoom = 0.095;
    }
    updateHudText();
  }

  function applyWaypoint(wp) {
    waypoint = (wp && !wp.clear && typeof wp.x === 'number' && typeof wp.y === 'number') ? wp : null;
    updateHudText();
  }

  let fetchFails = 0;

  function fetchStateSnapshot() {
    fetch(DEMO ? 'demo/state.json' : '/state?t=' + encodeURIComponent(TOKEN)).then(function (r) { return r.json(); }).then(function (st) {
      sseConnected = true;
      fetchFails = 0;
      pcSilent = false;
      const sameMap = !!(st.map && mapData && !mapData.isFallback && st.map.mapHash && st.map.mapHash === mapData.mapHash);
      if (st.map && !sameMap) {
        applyMapInit(st.map);
        if (st.deltas && st.deltas.length) {
          for (var d = 0; d < st.deltas.length; d++) applyMapDelta(st.deltas[d]);
        }
      }
      if (st.tick) applyTick(st.tick);
      applyWaypoint(st.waypoint);
      updateHudText();
    }).catch(function () {
      fetchFails++;
      pcSilent = fetchFails >= 2;
      updateHudText();
    });
  }

  fetchStateSnapshot();
  window.setInterval(function () {
    if (!sseConnected || !mapData || mapData.isFallback) {
      fetchStateSnapshot();
    }
  }, 2500);

  function connectSse() {
    if (DEMO) return;
    var es = new EventSource('/events?t=' + encodeURIComponent(TOKEN));
    es.onopen = function () {
      sseConnected = true;
      fetchFails = 0;
      pcSilent = false;
      updateHudText();
    };
    es.addEventListener('map_init', function (e) {
      try { applyMapInit(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener('map_delta', function (e) {
      try { applyMapDelta(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener('tick', function (e) {
      try { applyTick(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener('waypoint', function (e) {
      try { applyWaypoint(JSON.parse(e.data)); } catch (err) {}
    });
    es.onerror = function () {
      sseConnected = false;
      updateHudText();
    };
  }

  connectSse();
  window.requestAnimationFrame(renderLoop);
})();
</script>
</body>
