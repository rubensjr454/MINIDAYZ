<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>MiniDayZ — Mapa Satélite &amp; Radar Tático</title>
<style>
  :root {
    --bg: #0c1519;
    --panel: rgba(13, 19, 15, 0.92);
    --border: rgba(148, 180, 104, 0.45);
    --accent: #aed581;
    --gold: #ffd54f;
    --danger: #ff5252;
    --cyan: #4dd0e1;
    --text: #e8efe2;
    --muted: #9aa992;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #radar-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #172a30;
  }

  /* Barra Superior de Telemetria */
  #top-hud {
    position: fixed; top: env(safe-area-inset-top, 6px); left: 26px; right: 8px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; z-index: 12; backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.68);
  }
  .status-grp { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff9800; box-shadow: 0 0 6px #ff9800; flex-shrink: 0; }
  .dot.online { background: #76ff03; box-shadow: 0 0 8px #76ff03; }
  .tex-pill {
    font-size: 11px; font-weight: 700; color: #b0bec5;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px; padding: 1px 5px; display: none;
  }
  .vitals { display: flex; align-items: center; gap: 6px; font-size: 11px; flex-wrap: wrap; }
  .vital-pill, .mono { font-family: Consolas, "SF Mono", "Roboto Mono", monospace; }
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px; padding: 2px 6px; font-weight: 700;
  }
  .v-hp, .v-wt, .v-fd { color: var(--text); }
  .lvl-ok { color: #9ccc65; border-color: rgba(156, 204, 101, 0.45); }
  .lvl-warn { color: #ffd54f; border-color: rgba(255, 213, 79, 0.5); }
  .lvl-bad { color: #ff5252; border-color: rgba(255, 82, 82, 0.6); background: rgba(255, 82, 82, 0.12); }
  .v-tm { color: #ccff90; }
  .v-sec { color: #dce775; border-color: rgba(220, 231, 117, 0.35); }

  /* Botões Flutuantes (Direita) */
  #fab-col {
    position: fixed; right: 10px; top: 68px;
    display: flex; flex-direction: column; gap: 7px; z-index: 12;
  }
  .tac-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px; font-size: 11.5px; font-weight: 700;
    cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.62); font-family: inherit;
    text-align: left; min-height: 44px; min-width: 44px;
  }
  .tac-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(34, 48, 28, 0.95); }
  .tac-btn.wp-clear { border-color: rgba(255, 213, 79, 0.65); color: var(--gold); display: none; }

  /* Card Flutuante de Inspeção ao Tocar em um Ícone/Ponto */
  #poi-card {
    position: fixed; left: 30px; top: 68px; max-width: min(340px, calc(100vw - 24px));
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    background: rgba(12, 18, 14, 0.94); border: 1px solid var(--gold);
    border-radius: 8px; padding: 6px 10px; z-index: 12;
    box-shadow: 0 4px 16px rgba(0,0,0,0.75); font-size: 11.5px;
  }
  #poi-card-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #poi-card-title { font-weight: 700; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #poi-card-sub { font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }
  #poi-card-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .mini-btn {
    background: rgba(77, 208, 225, 0.14); color: var(--cyan); border: 1px solid rgba(77, 208, 225, 0.55);
    border-radius: 5px; padding: 4px 9px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; min-height: 34px;
  }
  .mini-btn.close { background: rgba(255,255,255,0.06); color: var(--muted); border-color: rgba(255,255,255,0.2); }

  /* Gaveta Inferior de Filtros Táticos */
  #bottom-drawer {
    position: fixed; left: 26px; right: 8px; bottom: calc(env(safe-area-inset-bottom, 6px) + 6px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 11px; z-index: 12; box-shadow: 0 -4px 18px rgba(0,0,0,0.72);
  }
  #drawer-head {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--accent);
  }
  #filters-body {
    margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(140, 172, 98, 0.25);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 5px 12px;
  }
  #bottom-drawer.collapsed #filters-body, #bottom-drawer.collapsed #drawer-extra { display: none; }
  .cnt { color: var(--muted); font-weight: 700; }
  .flt-actions { display: flex; gap: 8px; margin-top: 8px; }
  #legend { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; max-height: 32vh; overflow-y: auto; }
  #legend.hidden { display: none; }
  .lg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); }
  .lg-item canvas { width: 20px; height: 20px; flex-shrink: 0; }
  .flt-item {
    display: flex; align-items: center; gap: 8px; font-size: 11.5px; cursor: pointer;
    padding: 2px 2px;
  }
  .flt-item input { width: 15px; height: 15px; accent-color: #9ccc65; cursor: pointer; flex-shrink: 0; }
  .badge-gold { color: var(--gold); font-weight: 700; }
  .badge-crash { color: #ff8a65; font-weight: 700; }
  .badge-lmk { color: #dce775; font-weight: 700; }
  .badge-threat { color: var(--danger); font-weight: 700; }
  .badge-quest { color: var(--cyan); font-weight: 700; }
  .badge-wp { color: var(--cyan); font-weight: 700; }
  .v-qst { color: #80d8ff; border-color: rgba(77, 208, 225, 0.45); display: none; }

  #waiting-banner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(12, 16, 12, 0.93); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; text-align: center; z-index: 6; max-width: 88vw; pointer-events: none;
  }
  #prog-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; font-size: 11px; }
  .xp-wrap { flex: 1 1 100%; position: relative; height: 18px; }
  .xp-bar { position: absolute; inset: 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255, 213, 79, 0.45); border-radius: 4px; overflow: hidden; }
  #xp-fill { height: 100%; width: 0; background: linear-gradient(90deg, #b28704, #ffd54f); transition: width 0.4s; }
  .xp-wrap.ready .xp-bar { border-color: #76ff03; box-shadow: 0 0 8px rgba(118, 255, 3, 0.6); }
  .xp-wrap.ready #xp-fill { background: linear-gradient(90deg, #33691e, #76ff03); }
  #xp-txt { position: relative; display: block; text-align: center; line-height: 18px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .karma-good { color: #69f0ae; border-color: rgba(105, 240, 174, 0.5); }
  .karma-bad { color: #ff8a80; border-color: rgba(255, 138, 128, 0.5); }
  #nearby-box { margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(140, 172, 98, 0.25); }
  .nb-head { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  #nearby { display: flex; flex-direction: column; gap: 3px; }
  .nb-item {
    display: flex; align-items: center; gap: 7px; width: 100%; min-height: 32px; padding: 3px 6px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 5px;
    color: var(--text); font: inherit; font-size: 11.5px; cursor: pointer; text-align: left;
  }
  .nb-item canvas { width: 18px; height: 18px; flex-shrink: 0; }
  .nb-item .nb-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb-item .nb-dist { font-family: Consolas, monospace; color: var(--muted); }
  #side-panel { display: contents; }
  #waiting-banner.warn { border-color: rgba(255, 152, 0, 0.7); }
  #waiting-banner.warn h2 { color: #ffb74d; }

  @media (max-width: 899px) {
    .vitals { gap: 4px; }
    .vital-pill { padding: 2px 5px; }
    #fab-col .tac-btn { padding: 8px; text-align: center; font-size: 15px; }
    #fab-col .lbl { display: none; }
    #fab-col { align-items: flex-end; }
    #btn-follow { font-size: 12px !important; }
    .flt-item { min-height: 36px; }
  }

  /* Desktop / 2º monitor: painel lateral fixo à direita */
  @media (min-width: 900px) {
    #side-panel {
      display: flex; flex-direction: column; gap: 8px;
      position: fixed; top: 8px; right: 8px; bottom: 8px; width: 310px; z-index: 12;
    }
    #top-hud, #bottom-drawer {
      position: static; left: auto; right: auto; top: auto; bottom: auto; width: 100%;
    }
    #top-hud { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; }
    #top-hud .status-grp { font-size: 14px; flex-wrap: wrap; }
    #top-hud .vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; }
    #top-hud .vital-pill { text-align: center; padding: 4px 6px; }
    #top-hud .v-sec, #top-hud .v-qst, #top-hud #v-threat { grid-column: 1 / -1; }
    #bottom-drawer { flex: 1; min-height: 0; overflow-y: auto; }
    #bottom-drawer.collapsed #filters-body { display: grid; }
    #bottom-drawer.collapsed #drawer-extra { display: block; }
    #drawer-toggle-lbl { display: none; }
    #drawer-head { cursor: default; }
    #filters-body { grid-template-columns: 1fr; }
    #fab-col { right: 330px; top: 12px; }
    #fab-col .tac-btn { min-width: 118px; }
    #btn-zoom-in, #btn-zoom-out { border-radius: 0; margin-top: -7px; }
    #btn-zoom-in { border-radius: 7px 7px 0 0; margin-top: 0; }
    #btn-zoom-out { border-radius: 0 0 7px 7px; }
  }
  #waiting-banner h2 { font-size: 14px; color: var(--accent); margin-bottom: 6px; }
  #waiting-banner p { font-size: 12px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
  <canvas id="radar-canvas"></canvas>

  <aside id="side-panel">
  <div id="top-hud">
    <div class="status-grp">
      <span id="conn-dot" class="dot"></span>
      <span id="hud-title">CONECTANDO AO PC...</span>
      <span id="tex-status" class="tex-pill">SATÉLITE HD</span>
    </div>
    <div class="vitals">
      <span class="vital-pill v-hp" id="v-hp">❤ --%</span>
      <span class="vital-pill v-wt" id="v-wt">💧 --%</span>
      <span class="vital-pill v-fd" id="v-fd">🥫 --%</span>
      <span class="vital-pill v-tm" id="v-tm">🌡 --</span>
      <span class="vital-pill v-sec" id="v-pos">SETOR --</span>
      <span class="vital-pill v-qst" id="v-qst">📜 MISSÃO</span>
      <span class="vital-pill lvl-bad" id="v-threat" style="display:none"></span>
    </div>
    <div id="prog-row">
      <div class="xp-wrap" title="XP até o próximo perk">
        <div class="xp-bar"><div id="xp-fill"></div></div>
        <span id="xp-txt" class="mono">XP --</span>
      </div>
      <span class="vital-pill" id="v-karma" title="Carma">☯ --</span>
      <span class="vital-pill" id="v-kills" title="Zumbis / bandidos abatidos">☠ --</span>
    </div>
  </div>

  <div id="poi-card">
    <div id="poi-card-info">
      <div id="poi-card-title">Ponto Tático</div>
      <div id="poi-card-sub">Setor -- • --m</div>
    </div>
    <div id="poi-card-actions">
      <button type="button" class="mini-btn" id="btn-poi-wp">📍 Waypoint</button>
      <button type="button" class="mini-btn" id="btn-poi-center">⌖ Centralizar</button>
      <button type="button" class="mini-btn close" id="btn-poi-close">✕</button>
    </div>
  </div>

  <div id="fab-col">
    <button type="button" class="tac-btn active" id="btn-follow">📍 Onde estou</button>
    <button type="button" class="tac-btn" id="btn-fit" title="Ilha inteira">🗺️<span class="lbl"> Ilha</span></button>
    <button type="button" class="tac-btn" id="btn-zoom-in" title="Aproximar">＋<span class="lbl"> Zoom</span></button>
    <button type="button" class="tac-btn" id="btn-zoom-out" title="Afastar">－<span class="lbl"> Zoom</span></button>
    <button type="button" class="tac-btn wp-clear" id="btn-clear-wp" title="Limpar waypoint">✕<span class="lbl"> Limpar WP</span></button>
  </div>

  <div id="waiting-banner">
    <h2 id="wait-title">CONECTANDO AO PC...</h2>
    <p id="wait-msg">Procurando o MiniDayZ na rede local.</p>
  </div>

  <div id="bottom-drawer" class="collapsed">
    <div id="drawer-head">
      <span>CAMADAS DO SATÉLITE &amp; FILTROS TÁTICOS</span>
      <span id="drawer-toggle-lbl">[Expandir ▲]</span>
    </div>
    <div id="filters-body">
      <label class="flt-item">
        <input type="checkbox" id="flt-secrets" checked />
        <span class="badge-gold">★ Secret Location (1/Ilha) &amp; Bunkers <b class="cnt" id="cnt-secrets"></b></span>
      </label>
      <label class="flt-item">
        <input type="checkbox" id="flt-crashes" checked />
        <span class="badge-crash">🚁 Heli Crashes, Veículos &amp; Tendas <b class="cnt" id="cnt-crashes"></b></span>
      </label>
      <label class="flt-item">
        <input type="checkbox" id="flt-landmarks" checked />
        <span class="badge-lmk">🏛️ Pontos de Referência (Igreja, Hosp., Mil.) <b class="cnt" id="cnt-landmarks"></b></span>
      </label>
      <label class="flt-item">
        <input type="checkbox" id="flt-threats" checked />
        <span class="badge-threat">⚠️ Radar de Ameaças Próximas <b class="cnt" id="cnt-threats"></b></span>
      </label>
      <label class="flt-item">
        <input type="checkbox" id="flt-quests" checked />
        <span class="badge-quest">❗ Missões &amp; Sobreviventes Neutros <b class="cnt" id="cnt-quests"></b></span>
      </label>
      <label class="flt-item">
        <input type="checkbox" id="flt-waypoint" checked />
        <span class="badge-wp">📍 Waypoint no PC: segurar ou duplo toque no mapa</span>
      </label>
    </div>
    <div id="drawer-extra">
      <div id="nearby-box">
        <div class="nb-head">PERTO DE VOCÊ <span class="cnt">(toque = waypoint)</span></div>
        <div id="nearby"></div>
      </div>
      <div class="flt-actions">
        <button type="button" class="mini-btn" id="btn-essential">Só essencial</button>
        <button type="button" class="mini-btn close" id="btn-legend">Legenda ▸</button>
      </div>
      <div id="legend" class="hidden"></div>
    </div>
  </div>
  </aside>

<script>
(function () {
  'use strict';
  var TOKEN = new URLSearchParams(window.location.search).get('t') || '';
  // ?demo=1: carrega demo/state.json (mesmo formato do /state) para ajustar o visual sem o jogo; servir a pasta companion por HTTP local
  const DEMO = new URLSearchParams(window.location.search).get('demo') === '1';

  var PX_PER_METER = 22;
  var LABEL_ZOOM_THRESHOLD = 0.095; // Oculta rótulos fixos em zoom distante para nunca tampar ruas/prédios
  var LANDMARK_BADGE_ZOOM = 0.048;
  var MAX_STATIC_DIM = 2688; // Alta definição aérea mantendo baixo consumo de VRAM em celulares

  var ROAD_TILE_INDICES = {
    0: 1, 1: 1, 2: 1, 4: 1, 5: 1, 7: 1, 8: 1, 9: 1, 10: 1, 11: 1, 12: 1, 15: 1, 16: 1, 20: 1
  };

  var LANDMARK_STYLE = {
    mil:    { icon: '★', color: '#8fa3b8', stroke: '#4f6378', prio: 3 },
    med:    { icon: '✚', color: '#4dd0e1', stroke: '#00838f', prio: 3 },
    ch:     { icon: '⛪', color: '#fff176', stroke: '#f9a825', prio: 3 },
    castle: { icon: '🏰', color: '#ffe082', stroke: '#ff8f00', prio: 3 },
    pol:    { icon: '🛡', color: '#9fa8da', stroke: '#3949ab', prio: 4 },
    fire:   { icon: '🚒', color: '#ff8a65', stroke: '#d84315', prio: 4 },
    gas:    { icon: '⛽', color: '#ffb74d', stroke: '#ef6c00', prio: 4 },
    gun:    { icon: '🎯', color: '#ce93d8', stroke: '#8e24aa', prio: 4 },
    shop:   { icon: '🛒', color: '#bcaaa4', stroke: '#5d4037', prio: 5 },
    school: { icon: '🏫', color: '#b0bec5', stroke: '#455a64', prio: 5 },
    pump:   { icon: '💧', color: '#4fc3f7', stroke: '#0277bd', prio: 5 }
  };

  var canvas = document.getElementById('radar-canvas');
  var ctx = canvas.getContext('2d', { alpha: false });

  // Camada estática pré-renderizada em OffscreenCanvas (zero custo por frame de 1Hz)
  var staticLayer = createOffscreenSurface(512, 512);
  var staticCtx = staticLayer.getContext('2d', { alpha: false });
  var staticScale = 0.13;

  var imgCache = {};       // filename -> { status: 'loading'|'ok'|'err', img: HTMLImageElement }
  var tileSliceCache = {}; // key -> Canvas/OffscreenCanvas de tile 60x60 já rotacionado/espelhado
  var rebakeTimer = 0;

  var mapData = null;
  var landmarks = [];      // Pontos de referência extraídos dos prédios principais (agrupados por proximidade)
  var tickData = null;
  var waypoint = null;
  var sseConnected = false;

  var hoveredPoi = null;
  var selectedPoi = null;
  var interactiveTargets = []; // Lista da última frame para hit-test instantâneo de mouse/toque

  var filters = {
    secrets: true,
    crashes: true,
    landmarks: true,
    quests: true,
    threats: true,
    waypointTap: true
  };

  var cam = {
    x: 8925,
    y: 10000,
    zoom: 0.045,
    follow: true,
    initialized: false
  };

  var connDot = document.getElementById('conn-dot');
  var hudTitle = document.getElementById('hud-title');
  var texStatus = document.getElementById('tex-status');
  var elHp = document.getElementById('v-hp');
  var elWt = document.getElementById('v-wt');
  var elFd = document.getElementById('v-fd');
  var elTm = document.getElementById('v-tm');
  var elPos = document.getElementById('v-pos');
  var elQst = document.getElementById('v-qst');
  var waitBanner = document.getElementById('waiting-banner');
  var btnFollow = document.getElementById('btn-follow');
  var btnClearWp = document.getElementById('btn-clear-wp');
  var drawer = document.getElementById('bottom-drawer');
  var drawerToggleLbl = document.getElementById('drawer-toggle-lbl');
  var poiCard = document.getElementById('poi-card');
  var poiCardTitle = document.getElementById('poi-card-title');
  var poiCardSub = document.getElementById('poi-card-sub');

  function createOffscreenSurface(w, h) {
    if (typeof OffscreenCanvas !== 'undefined') {
      try {
        return new OffscreenCanvas(w, h);
      } catch (e) {}
    }
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  function resizeSurface(surf, w, h) {
    if (surf.width !== w) surf.width = w;
    if (surf.height !== h) surf.height = h;
  }

  function resizeViewport() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeViewport);
  resizeViewport();

  function getGridSpec() {
    if (mapData && mapData.blocks && mapData.blocks.cols > 0 && mapData.blocks.rows > 0) {
      return {
        cols: mapData.blocks.cols,
        rows: mapData.blocks.rows,
        originX: mapData.blocks.originX,
        originY: mapData.blocks.originY,
        cellW: mapData.blocks.blockPx || 1020,
        cellH: mapData.blocks.blockPx || 1020
      };
    }
    var mw = (mapData && mapData.width) || 17850;
    var mh = (mapData && mapData.height) || 20000;
    var cols = Math.max(4, Math.min(16, Math.round(mw / 1020) || 10));
    var rows = Math.max(4, Math.min(18, Math.round(mh / 1020) || 10));
    return {
      cols: cols,
      rows: rows,
      originX: 0,
      originY: 0,
      cellW: mw / cols,
      cellH: mh / rows
    };
  }

  function colLetters(c) {
    if (c < 26) return String.fromCharCode(65 + c);
    return String.fromCharCode(65 + Math.floor(c / 26) - 1) + String.fromCharCode(65 + (c % 26));
  }

  function sectorLabel(wx, wy) {
    const g = getGridSpec();
    const cx = Math.floor((wx - g.originX) / g.cellW);
    const cy = Math.floor((wy - g.originY) / g.cellH);
    if (cx < 0 || cy < 0 || cx >= g.cols || cy >= g.rows) return '--';
    return colLetters(cx) + (cy + 1);
  }

  const CARDINALS = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];
  const ISLAND_ZOOM = 0.06;
  const AUTO_RECENTER_MS = 15000;
  const TRAIL_STEP_MS = 2000;
  const TRAIL_MAX_MS = 600000;
  const PLACE_CODES = {
    6: { name: 'CIDADE', size: 15 },
    5: { name: 'BASE MILITAR', size: 12.5 },
    9: { name: 'VILA', size: 12.5 },
    11: { name: 'HOSPITAL', size: 11.5 },
    15: { name: 'BOMBEIROS', size: 11.5 }
  };

  let trail = [];
  let lastInteract = Date.now();
  let offscreenHit = null;
  let hudBottom = 54;
  let drawerTop = 0;
  let panelW = 0;
  let pcSilent = false;
  const waitTitle = document.getElementById('wait-title');
  const waitMsg = document.getElementById('wait-msg');
  const desktopMq = window.matchMedia('(min-width: 900px)');

  function bearingDeg(dx, dy) {
    return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
  }

  function cardinal(deg) {
    return CARDINALS[Math.round(deg / 45) % 8];
  }

  function fmtDist(m) {
    return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + 'km' : Math.round(m) + 'm';
  }

  function distBearingText(fromX, fromY, toX, toY) {
    const dx = toX - fromX;
    const dy = toY - fromY;
    return fmtDist(Math.hypot(dx, dy) / PX_PER_METER) + ' • ' + cardinal(bearingDeg(dx, dy));
  }

  function measureChrome() {
    if (desktopMq.matches) {
      const side = document.getElementById('side-panel');
      panelW = side ? Math.round(window.innerWidth - side.getBoundingClientRect().left) + 8 : 0;
      hudBottom = 8;
      drawerTop = window.innerHeight;
      const fabD = document.getElementById('fab-col');
      if (fabD) fabD.style.top = '';
      return;
    }
    panelW = 0;
    const hud = document.getElementById('top-hud');
    const drw = document.getElementById('bottom-drawer');
    if (hud) hudBottom = hud.getBoundingClientRect().bottom;
    drawerTop = drw ? drw.getBoundingClientRect().top : window.innerHeight;
    const fab = document.getElementById('fab-col');
    if (fab) fab.style.top = Math.round(hudBottom + 8) + 'px';
  }

  function markInteract() {
    lastInteract = Date.now();
  }

  window.addEventListener('resize', measureChrome);
  measureChrome();

  function buildPlaceNames(data) {
    placeNames = [];
    const blk = data && data.blocks;
    if (!blk || !blk.matrix || !blk.cols || !blk.rows) return;
    const bp = blk.blockPx || 1020;
    const seen = {};
    for (let x = 0; x < blk.cols; x++) {
      for (let y = 0; y < blk.rows; y++) {
        const code = blk.matrix[x] && blk.matrix[x][y];
        const st = PLACE_CODES[code];
        if (!st || seen[x + ',' + y]) continue;
        const stack = [[x, y]];
        seen[x + ',' + y] = true;
        let sx = 0, sy = 0, n = 0;
        while (stack.length) {
          const c = stack.pop();
          sx += c[0]; sy += c[1]; n++;
          const nb = [[c[0] + 1, c[1]], [c[0] - 1, c[1]], [c[0], c[1] + 1], [c[0], c[1] - 1]];
          for (let k = 0; k < 4; k++) {
            const nx = nb[k][0], ny = nb[k][1];
            if (nx < 0 || ny < 0 || nx >= blk.cols || ny >= blk.rows || seen[nx + ',' + ny]) continue;
            if (blk.matrix[nx][ny] !== code) continue;
            seen[nx + ',' + ny] = true;
            stack.push([nx, ny]);
          }
        }
        placeNames.push({
          x: blk.originX + (sx / n + 0.5) * bp,
          y: blk.originY + (sy / n + 0.5) * bp,
          text: st.name,
          size: st.size + Math.min(3, n - 1)
        });
      }
    }
    placeNames.sort(function (a, b) { return b.size - a.size; });
  }

  function pushTrail(p) {
    if (!p || p.inBunker) return;
    const now = Date.now();
    const last = trail[trail.length - 1];
    if (last && Math.hypot(p.x - last.x, p.y - last.y) > 4000) trail = [];
    if (!last || now - last.t >= TRAIL_STEP_MS) trail.push({ x: p.x, y: p.y, t: now });
    while (trail.length && now - trail[0].t > TRAIL_MAX_MS) trail.shift();
  }

  function fitIsland() {
    if (!mapData) return;
    measureChrome();
    const g = getGridSpec();
    const x0 = Math.max(0, g.originX);
    const y0 = Math.max(0, g.originY);
    const w = Math.min(mapData.width, g.originX + g.cols * g.cellW) - x0;
    const h = Math.min(mapData.height, g.originY + g.rows * g.cellH) - y0;
    const vw = Math.max(200, window.innerWidth - panelW - 60);
    const vh = Math.max(200, (drawerTop || window.innerHeight) - hudBottom - 50);
    cam.zoom = Math.max(0.012, Math.min(vw / (w * 1.04), vh / (h * 1.04)));
    cam.x = x0 + w * 0.5;
    cam.y = y0 + h * 0.5 - ((drawerTop || window.innerHeight) + hudBottom - window.innerHeight) * 0.5 / cam.zoom;
  }

  // =========================================================================
  // CARREGAMENTO ASSÍNCRONO DE TEXTURAS REAIS DO JOGO (/images/*)
  // =========================================================================
  let overviewTimer = 0;

  function texturesLoading() {
    for (const k in imgCache) {
      if (imgCache[k].status === 'loading') return true;
    }
    return false;
  }

  // Carga inicial (texturas chegando) usa debounce maior para não refazer o bake várias vezes
  function scheduleRebake() {
    if (rebakeTimer) return;
    rebakeTimer = window.setTimeout(function () {
      rebakeTimer = 0;
      bakeStaticMap();
    }, texturesLoading() ? 450 : 110);
  }

  // Delta: só refaz estradas reais + mancha urbana do overview
  function scheduleOverviewDelta() {
    if (overviewTimer) return;
    overviewTimer = window.setTimeout(function () {
      overviewTimer = 0;
      if (!mapData || !mapData.__masks) return;
      mapData.__masks.urban = buildUrbanMask(mapData, mapData.__masks);
      buildRoadNetwork(mapData);
      bakeOverview();
    }, 300);
  }

  // Desenha só os tilemaps/prédios novos por cima do bake existente
  function bakeDelta(tms, blds) {
    if (rebakeTimer || !staticLayer.width) return;
    staticCtx.save();
    staticCtx.imageSmoothingEnabled = true;
    staticCtx.scale(staticScale, staticScale);
    drawTilemapList(tms);
    drawBuildingList(blds);
    staticCtx.restore();
    invalidate();
  }

  function buildingKey(x, y) {
    return Math.floor(x / 36) + ',' + Math.floor(y / 36);
  }

  function buildingIndex() {
    if (mapData.__bIdx) return mapData.__bIdx;
    const idx = new Map();
    const blds = mapData.buildings || [];
    for (let i = 0; i < blds.length; i++) idx.set(buildingKey(blds[i][0], blds[i][1]), i);
    mapData.__bIdx = idx;
    return idx;
  }

  function findNearBuilding(idx, x, y) {
    const cx = Math.floor(x / 36), cy = Math.floor(y / 36);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const i = idx.get((cx + dx) + ',' + (cy + dy));
        if (i === undefined) continue;
        const b = mapData.buildings[i];
        if (Math.abs(b[0] - x) <= 36 && Math.abs(b[1] - y) <= 36) return i;
      }
    }
    return -1;
  }

  function rebuildVector() {
    if (!mapData) return;
    mapData.__masks = null;
    mapData.__bIdx = null;
    THEME = isWinterMap(mapData) ? THEME_WINTER : THEME_SUMMER;
    buildRoadNetwork(mapData);
    bakeOverview();
  }

  function ensureMapTextures(data) {
    if (!data || !data.images || !data.images.length) return;
    var pending = 0;
    var loaded = 0;

    for (var i = 0; i < data.images.length; i++) {
      var fn = data.images[i];
      if (!fn) continue;
      var entry = imgCache[fn];
      if (entry) {
        if (entry.status === 'ok') loaded++;
        else if (entry.status === 'loading') pending++;
        continue;
      }

      pending++;
      (function (fileName) {
        var rec = { status: 'loading', img: null, tries: 0 };
        imgCache[fileName] = rec;
        function load() {
          var im = new Image();
          im.decoding = 'async';
          im.onload = function () {
            rec.status = 'ok';
            rec.img = im;
            updateTextureBadge();
            scheduleRebake();
          };
          im.onerror = function () {
            if (rec.tries++ < 1) {
              window.setTimeout(load, 1500);
              return;
            }
            rec.status = 'err';
            updateTextureBadge();
          };
          im.src = '/images/' + encodeURIComponent(fileName) + '?t=' + encodeURIComponent(TOKEN) + (rec.tries ? '&r=' + rec.tries : '');
        }
        load();
      })(fn);
    }

    updateTextureBadge();
  }

  function updateTextureBadge() {
    if (!mapData || !mapData.images || !mapData.images.length) {
      texStatus.style.display = 'none';
      return;
    }
    var ok = 0;
    var loading = 0;
    for (var i = 0; i < mapData.images.length; i++) {
      var st = imgCache[mapData.images[i]];
      if (!st || st.status === 'loading') loading++;
      else if (st.status === 'ok') ok++;
    }
    texStatus.style.display = 'inline-block';
    var total = mapData.images.length;
    texStatus.textContent = ok === total ? 'SATÉLITE HD' : ('TEXTURAS ' + ok + '/' + total + (loading ? '' : ' ⚠'));
  }

  function getLoadedImgByIdx(imgIdx) {
    if (!mapData || !mapData.images || imgIdx < 0 || imgIdx >= mapData.images.length) return null;
    var fn = mapData.images[imgIdx];
    var rec = imgCache[fn];
    return (rec && rec.status === 'ok') ? rec.img : null;
  }

  function getLoadedImgByName(fn) {
    if (!fn) return null;
    var rec = imgCache[fn];
    return (rec && rec.status === 'ok') ? rec.img : null;
  }

  // Recorta e transforma um tile do Construct 2 (id + flags h/v/d) exatamente como g.Ps / g.zq do c2runtime.js
  function getTileSliceSurface(imgIdx, img, tileId, flipH, flipV, flipD, tw, th, ox, oy, spx, spy) {
    var cacheKey = imgIdx + ':' + tileId + ':' + (flipH ? 1 : 0) + (flipV ? 1 : 0) + (flipD ? 1 : 0) + ':' + tw + 'x' + th;
    if (tileSliceCache[cacheKey] !== undefined) return tileSliceCache[cacheKey];

    // Mapeia índice linear do tile (row-major na spritesheet)
    var curIdx = 0;
    var sx = -1;
    var sy = -1;
    for (var y = oy; y + th <= img.height; y += th + spy) {
      for (var x = ox; x + tw <= img.width; x += tw + spx) {
        if (curIdx === tileId) {
          sx = x;
          sy = y;
          break;
        }
        curIdx++;
      }
      if (sx >= 0) break;
    }

    if (sx < 0) {
      tileSliceCache[cacheKey] = null;
      return null;
    }

    var surf = createOffscreenSurface(tw, th);
    var p = surf.getContext('2d');
    p.save();
    if (flipH) {
      if (flipV) {
        if (flipD) {
          p.rotate(Math.PI / 2);
          p.scale(-1, 1);
        } else {
          p.scale(-1, -1);
        }
        p.translate(-tw, -th);
      } else if (flipD) {
        p.rotate(Math.PI / 2);
        p.translate(0, -th);
      } else {
        p.scale(-1, 1);
        p.translate(-tw, 0);
      }
    } else if (flipV) {
      if (flipD) {
        p.rotate(-Math.PI / 2);
        p.translate(-tw, 0);
      } else {
        p.scale(1, -1);
        p.translate(0, -th);
      }
    } else if (flipD) {
      p.scale(-1, 1);
      p.rotate(Math.PI / 2);
    }
    p.drawImage(img, sx, sy, tw, th, 0, 0, tw, th);
    p.restore();

    tileSliceCache[cacheKey] = surf;
    return surf;
  }

  function drawSpriteInstance(sCtx, sprIdx, x, y, w, h, angle) {
    if (!mapData || !mapData.sprites || sprIdx < 0 || sprIdx >= mapData.sprites.length) return false;
    var spr = mapData.sprites[sprIdx];
    var img = getLoadedImgByIdx(spr[0]);
    if (!img) return false;

    var sx = spr[1];
    var sy = spr[2];
    var sw = spr[3];
    var sh = spr[4];
    var ox = spr[5];
    var oy = spr[6];
    if (sw <= 0 || sh <= 0) return false;

    var signX = w < 0 ? -1 : 1;
    var signY = h < 0 ? -1 : 1;
    var aw = Math.abs(w);
    var ah = Math.abs(h);
    if (aw <= 0 || ah <= 0) return false;

    sCtx.save();
    sCtx.translate(x, y);
    if (angle) sCtx.rotate(angle);
    if (signX < 0 || signY < 0) sCtx.scale(signX, signY);
    sCtx.drawImage(img, sx, sy, sw, sh, -ox * aw, -oy * ah, aw, ah);
    sCtx.restore();
    return true;
  }

  // Extrai pontos de referência nomeados (Igreja, Hospital, Base Militar, Posto...) agrupando barracas vizinhas
  function buildLandmarksIndex(data) {
    landmarks = [];
    if (!data || !data.buildings) return;
    var blds = data.buildings;
    for (var i = 0; i < blds.length; i++) {
      var b = blds[i];
      var kind = b[5];
      var lbl = b[7];
      var st = LANDMARK_STYLE[kind];
      if (!st || !lbl) continue;

      var bx = b[0];
      var by = b[1];
      var minDist = kind === 'mil' ? 520 : (kind === 'pump' ? 360 : 280);
      var d2Max = minDist * minDist;
      var merged = false;
      for (var k = 0; k < landmarks.length; k++) {
        if (landmarks[k].kind === kind) {
          var dx = landmarks[k].x - bx;
          var dy = landmarks[k].y - by;
          if (dx * dx + dy * dy <= d2Max) {
            if (kind === 'mil' && landmarks[k].label !== 'Base Militar') {
              landmarks[k].label = 'Base Militar';
            }
            merged = true;
            break;
          }
        }
      }
      if (!merged) {
        landmarks.push({
          x: bx,
          y: by,
          kind: kind,
          label: lbl,
          icon: st.icon,
          color: st.color,
          stroke: st.stroke,
          prio: st.prio
        });
      }
    }
  }

  // =========================================================================

    ally:    { name: 'Sobrevivente aliado', color: '#69f0ae', shape: 'dot', size: 0.8, prio: 3, legend: true }
  };
  const ICON_OUTLINE = '#0b1210';
  const CLUSTER_PX = 24;

  function iconPath(c, shape, x, y, r) {
    c.beginPath();
    switch (shape) {
      case 'star': {
        let rot = -Math.PI / 2;
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 ? r * 0.48 : r * 1.15;
          c.lineTo(x + Math.cos(rot) * rr, y + Math.sin(rot) * rr);
          rot += Math.PI / 5;
        }
        break;
      }
      case 'diamond': c.moveTo(x, y - r * 1.1); c.lineTo(x + r * 1.1, y); c.lineTo(x, y + r * 1.1); c.lineTo(x - r * 1.1, y); break;
      case 'triangle': c.moveTo(x, y - r * 1.1); c.lineTo(x + r * 1.05, y + r * 0.85); c.lineTo(x - r * 1.05, y + r * 0.85); break;
      case 'tent': c.moveTo(x, y - r); c.lineTo(x + r * 1.15, y + r * 0.8); c.lineTo(x + r * 0.25, y + r * 0.8); c.lineTo(x, y + r * 0.1); c.lineTo(x - r * 0.25, y + r * 0.8); c.lineTo(x - r * 1.15, y + r * 0.8); break;
      case 'rect': c.rect(x - r, y - r * 0.7, r * 2, r * 1.4); break;
      case 'qitem': c.rect(x - r * 0.75, y - r * 0.75, r * 1.5, r * 1.5); break;
      case 'cross': {
        const a = r * 0.38;
        c.moveTo(x - a, y - r); c.lineTo(x + a, y - r); c.lineTo(x + a, y - a); c.lineTo(x + r, y - a); c.lineTo(x + r, y + a);
        c.lineTo(x + a, y + a); c.lineTo(x + a, y + r); c.lineTo(x - a, y + r); c.lineTo(x - a, y + a); c.lineTo(x - r, y + a);
        c.lineTo(x - r, y - a); c.lineTo(x - a, y - a);
        break;
      }
      case 'shield':
        c.moveTo(x - r, y - r * 0.85); c.lineTo(x + r, y - r * 0.85); c.lineTo(x + r, y);
        c.quadraticCurveTo(x + r * 0.9, y + r * 0.8, x, y + r * 1.15);
        c.quadraticCurveTo(x - r * 0.9, y + r * 0.8, x - r, y);
        break;
      case 'drop':
        c.moveTo(x, y - r * 1.15);
        c.quadraticCurveTo(x + r, y + r * 0.1, x + r * 0.75, y + r * 0.45);
        c.arc(x, y + r * 0.3, r * 0.75, 0.2, Math.PI - 0.2);
        c.quadraticCurveTo(x - r, y + r * 0.1, x, y - r * 1.15);
        break;
      case 'letter': c.rect(x - r, y - r, r * 2, r * 2); break;
      default: c.arc(x, y, r, 0, Math.PI * 2);
    }
    c.closePath();
  }

  function drawIconShape(c, key, x, y, r, glyph) {
    const st = ICON_STYLE[key];
    if (!st) return;
    const rad = r * (st.size || 1);
    c.save();
    c.lineJoin = 'round';
    if (st.shape === 'player') {
      c.translate(x, y);
      c.beginPath();
      c.moveTo(rad * 1.2, 0); c.lineTo(-rad * 0.8, rad * 0.8); c.lineTo(-rad * 0.45, 0); c.lineTo(-rad * 0.8, -rad * 0.8);
      c.closePath();
      c.fillStyle = '#ffffff'; c.fill();
      c.strokeStyle = ICON_OUTLINE; c.lineWidth = 1.6; c.stroke();
    } else if (st.shape === 'wp') {
      c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2);
      c.strokeStyle = st.color; c.lineWidth = 2.2; c.stroke();
      c.beginPath(); c.arc(x, y, rad * 0.4, 0, Math.PI * 2);
      c.fillStyle = '#ffd54f'; c.fill();
    } else if (st.shape === 'target') {
      c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2);
      c.strokeStyle = st.color; c.lineWidth = 2.2; c.stroke();
      c.beginPath();
      c.moveTo(x - rad * 1.35, y); c.lineTo(x - rad * 0.5, y); c.moveTo(x + rad * 0.5, y); c.lineTo(x + rad * 1.35, y);
      c.moveTo(x, y - rad * 1.35); c.lineTo(x, y - rad * 0.5); c.moveTo(x, y + rad * 0.5); c.lineTo(x, y + rad * 1.35);
      c.stroke();
      c.beginPath(); c.arc(x, y, rad * 0.3, 0, Math.PI * 2);
      c.fillStyle = st.color; c.fill();
    } else if (st.shape === 'ring') {
      c.beginPath(); c.arc(x, y, rad * 0.8, 0, Math.PI * 2);
      c.strokeStyle = ICON_OUTLINE; c.lineWidth = 4; c.stroke();
      c.strokeStyle = st.color; c.lineWidth = 2.2; c.stroke();
    } else {
      iconPath(c, st.shape, x, y, rad);
      c.fillStyle = st.shape === 'letter' ? 'rgba(11, 16, 13, 0.92)' : st.color;
      c.fill();
      c.strokeStyle = st.shape === 'letter' ? st.color : ICON_OUTLINE;
      c.lineWidth = st.shape === 'letter' ? 1.6 : 1.5;
      c.stroke();
      const g = glyph || st.glyph;
      if (g && (st.shape === 'letter' || st.shape === 'quest')) {
        c.font = 'bold ' + Math.round(rad * 1.35) + 'px Consolas, "Courier New", monospace';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillStyle = st.shape === 'letter' ? st.color : '#051b20';
        c.fillText(g, x, y + 0.5);
      }
    }
    c.restore();
  }

  // Atlas: cada ícone pré-renderizado uma vez em OffscreenCanvas e só copiado por frame
  const iconAtlas = new Map();

  function drawIcon(key, x, y, r, glyph) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const k = key + '|' + r + '|' + (glyph || '') + '|' + dpr;
    let s = iconAtlas.get(k);
    if (!s) {
      const st = ICON_STYLE[key];
      const half = Math.ceil(r * ((st && st.size) || 1) * 1.6 + 3);
      const surf = createOffscreenSurface(half * 2 * dpr, half * 2 * dpr);
      const c = surf.getContext('2d');
      c.scale(dpr, dpr);
      drawIconShape(c, key, half, half, r, glyph);
      s = { surf: surf, half: half };
      iconAtlas.set(k, s);
    }
    ctx.drawImage(s.surf, x - s.half, y - s.half, s.half * 2, s.half * 2);
  }

  // Agrupa ícones do mesmo tipo a menos de CLUSTER_PX na tela
  function clusterIcons(items) {
    const out = [];
    const used = new Uint8Array(items.length);
    for (let i = 0; i < items.length; i++) {
      if (used[i]) continue;
      const a = items[i];
      const grp = [a];
      used[i] = 1;
      for (let j = i + 1; j < items.length; j++) {
        if (used[j] || items[j].type !== a.type) continue;
        if (Math.abs(items[j].sx - a.sx) < CLUSTER_PX && Math.abs(items[j].sy - a.sy) < CLUSTER_PX) {
          grp.push(items[j]);
          used[j] = 1;
        }
      }
      if (grp.length === 1) {
        out.push(Object.assign({ count: 1 }, a));
        continue;
      }
      let wx = 0, wy = 0, sx = 0, sy = 0;
      for (let k = 0; k < grp.length; k++) { wx += grp[k].x; wy += grp[k].y; sx += grp[k].sx; sy += grp[k].sy; }
      const n = grp.length;
      out.push({ type: a.type, x: wx / n, y: wy / n, sx: sx / n, sy: sy / n, label: a.label, count: n });
    }
    return out;
  }

  function drawCountBadge(sx, sy, n) {
    const t = n > 99 ? '99+' : String(n);
    ctx.font = 'bold 9px Consolas, monospace';
    const w = Math.max(13, textW('badge9', t) + 6);
    const bx = sx + 6;
    const by = sy - 15;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bx, by, w, 12);
    ctx.strokeStyle = ICON_OUTLINE;
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, 11);
    ctx.fillStyle = '#0b1210';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t, bx + w / 2, by + 6.5);
  }

  // =========================================================================
  // MAPA VETORIAL (OVERVIEW): THEME, MÁSCARAS DE TERRENO E ESTRADAS REAIS
  // =========================================================================
  const THEME_SUMMER = {
    sea: '#1f3b4d', coast: '#2f5d6e', sand: '#cdbb8a', field: '#8a9a5b', forest: '#4b6b3a',
    road: '#e8dcc0', roadEdge: '#5a5244', dirt: '#b49a6a', building: '#6d6255',
    urban: '#9a8f7d', urbanAlpha: 0.55, bunker: '#272030'
  };
  const THEME_WINTER = Object.assign({}, THEME_SUMMER, {
    coast: '#3b6476', sand: '#d6d8d2', field: '#dfe4e6', forest: '#7b8e86',
    road: '#f5f2ea', roadEdge: '#5f6266', dirt: '#b7b0a2', building: '#66625c', urban: '#a3a3a0'
  });
  let THEME = THEME_SUMMER;

  const DETAIL_ZOOM_LO = 0.07;
  const DETAIL_ZOOM_HI = 0.09;
  const OVERVIEW_MAX_DIM = 1600;

  const overviewLayer = createOffscreenSurface(256, 256);
  const overviewCtx = overviewLayer.getContext('2d', { alpha: false });
  let overviewScale = 0.06;
  let roadNet = { real: [], schematic: [] };

  function isWinterMap(d) {
    return !!d && (d.island === 5 || (d.baseTileImg && d.baseTileImg.indexOf('lvl5') >= 0));
  }

  function hexRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function decodeTerrain(ter) {
    if (!ter || !ter.rle || !ter.cols || !ter.rows) return null;
    if (ter.__codes) return ter.__codes;
    const codes = new Uint8Array(ter.cols * ter.rows);
    const chunks = ter.rle.split(',');
    let idx = 0;
    for (let i = 0; i < chunks.length; i++) {
      const pair = chunks[i].split(':');
      const cnt = parseInt(pair[0], 10) || 0;
      const code = parseInt(pair[1], 10) || 0;
      if (code) codes.fill(code, idx, Math.min(codes.length, idx + cnt));
      idx += cnt;
    }
    ter.__codes = codes;
    return codes;
  }

  // Máscara 1px = 1 célula; ampliada com suavização vira mancha de borda arredondada
  function makeMask(cols, rows, color, pred) {
    const surf = createOffscreenSurface(cols, rows);
    const mctx = surf.getContext('2d');
    const img = mctx.createImageData(cols, rows);
    const rgb = hexRgb(color);
    const px = img.data;
    let any = false;
    for (let i = 0, n = cols * rows; i < n; i++) {
      if (!pred(i)) continue;
      const o = i * 4;
      px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
      any = true;
    }
    mctx.putImageData(img, 0, 0);
    return any ? roundMask(surf, cols, rows, rgb) : null;
  }

  // Blur + limiar: cantos arredondados e bordas nítidas (sem quadrado duro)
  function roundMask(src, cols, rows, rgb) {
    const up = 6;
    const out = createOffscreenSurface(cols * up, rows * up);
    const octx = out.getContext('2d', { willReadFrequently: true });
    if (!('filter' in octx)) return src;
    octx.imageSmoothingEnabled = true;
    octx.filter = 'blur(' + (up * 1.4) + 'px)';
    octx.drawImage(src, 0, 0, cols, rows, 0, 0, cols * up, rows * up);
    octx.filter = 'none';
    const img = octx.getImageData(0, 0, out.width, out.height);
    const px = img.data;
    for (let o = 0; o < px.length; o += 4) {
      if (px[o + 3] >= 100) {
        px[o] = rgb[0]; px[o + 1] = rgb[1]; px[o + 2] = rgb[2]; px[o + 3] = 255;
      } else {
        px[o + 3] = 0;
      }
    }
    octx.putImageData(img, 0, 0);
    return out;
  }

  function buildTerrainMasks(data) {
    const ter = data && data.terrain;
    const codes = decodeTerrain(ter);
    const cellPx = (ter && ter.cellPx) || 120;
    const mw = data.width || 17850;
    const mh = data.height || 20000;
    const cols = codes ? ter.cols : Math.ceil(mw / cellPx);
    const rows = codes ? ter.rows : Math.ceil(mh / cellPx);
    const g = getGridSpec();
    const inGrid = new Uint8Array(cols * rows);
    for (let r = 0; r < rows; r++) {
      const wy = (r + 0.5) * cellPx;
      const gy = (wy - g.originY) / g.cellH;
      for (let c = 0; c < cols; c++) {
        const gx = ((c + 0.5) * cellPx - g.originX) / g.cellW;
        if (gx >= 0 && gy >= 0 && gx < g.cols && gy < g.rows) inGrid[r * cols + c] = 1;
      }
    }
    const code = function (i) { return codes ? codes[i] : 0; };

    const isLand = new Uint8Array(cols * rows);
    for (let i = 0; i < isLand.length; i++) isLand[i] = inGrid[i] && code(i) !== 3 ? 1 : 0;

    const m = {
      cols: cols, rows: rows, cellPx: cellPx, isLand: isLand, codes: codes,
      land: makeMask(cols, rows, THEME.field, function (i) { return inGrid[i] && code(i) !== 3; }),
      halo: makeMask(cols, rows, THEME.coast, function (i) { return inGrid[i] && code(i) !== 3; }),
      water: makeMask(cols, rows, THEME.coast, function (i) { return inGrid[i] && code(i) === 3; }),
      sand: makeMask(cols, rows, THEME.sand, function (i) { return inGrid[i] && code(i) === 2; }),
      forest: makeMask(cols, rows, THEME.forest, function (i) { return inGrid[i] && code(i) === 1; }),
      bunker: makeMask(cols, rows, THEME.bunker, function (i) { return code(i) === 5; })
    };
    m.urban = buildUrbanMask(data, m);
    return m;
  }

  function buildUrbanMask(data, m) {
    const cols = m.cols, rows = m.rows, cellPx = m.cellPx;
    const urban = new Uint8Array(cols * rows);
    const blds = data.buildings || [];
    for (let i = 0; i < blds.length; i++) {
      const b = blds[i];
      if (b[5] === 'bridge') continue;
      const bc = Math.floor(b[0] / cellPx);
      const br = Math.floor(b[1] / cellPx);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const c = bc + dx, r = br + dy;
          if (c >= 0 && r >= 0 && c < cols && r < rows) urban[r * cols + c] = 1;
        }
      }
    }
    return makeMask(cols, rows, THEME.urban, function (i) { return urban[i] && !(m.codes && m.codes[i] === 3); });
  }

  function landPath(m) {
    if (m.path) return m.path;
    const p = new Path2D();
    for (let r = 0; r < m.rows; r++) {
      let c = 0;
      while (c < m.cols) {
        if (!m.isLand[r * m.cols + c]) { c++; continue; }
        const s = c;
        while (c < m.cols && m.isLand[r * m.cols + c]) c++;
        p.rect(s * m.cellPx, r * m.cellPx, (c - s) * m.cellPx, m.cellPx);
      }
    }
    m.path = p;
    return p;
  }

  function drawMask(c2d, mask, m, filter, alpha) {
    if (!mask) return;
    c2d.save();
    c2d.imageSmoothingEnabled = true;
    if (filter && 'filter' in c2d) c2d.filter = filter;
    if (alpha !== undefined) c2d.globalAlpha = alpha;
    c2d.drawImage(mask, 0, 0, mask.width, mask.height, 0, 0, m.cols * m.cellPx, m.rows * m.cellPx);
    c2d.restore();
  }

  // Estradas reais: células de tile de estrada dos tilemaps ground_lvl -> segmentos (runs H/V)
  function buildRoadNetwork(data) {
    const real = [];
    const covered = {};
    const g = getGridSpec();
    const cells = {};
    const tms = (data && data.tilemaps) || [];
    for (let mi = 0; mi < tms.length; mi++) {
      const tm = tms[mi];
      const fn = (data.images && data.images[tm[0]]) || '';
      if (fn.indexOf('ground_lvl') !== 0) continue;
      const x0 = tm[1], y0 = tm[2], tc = tm[3], tr = tm[4], tw = tm[5] || 60, th = tm[6] || 60;
      const gc0 = Math.floor((x0 - g.originX) / g.cellW), gc1 = Math.floor((x0 + tc * tw - 1 - g.originX) / g.cellW);
      const gr0 = Math.floor((y0 - g.originY) / g.cellH), gr1 = Math.floor((y0 + tr * th - 1 - g.originY) / g.cellH);
      for (let a = gc0; a <= gc1; a++) for (let b = gr0; b <= gr1; b++) covered[a + ',' + b] = true;

      const tokens = String(tm[7] || '').split(',');
      let cur = 0;
      const total = tc * tr;
      for (let k = 0; k < tokens.length && cur < total; k++) {
        const tok = tokens[k];
        if (!tok) continue;
        const xp = tok.indexOf('x');
        const rep = xp > 0 ? (parseInt(tok.substring(0, xp), 10) || 1) : 1;
        const id = parseInt(xp > 0 ? tok.substring(xp + 1) : tok, 10);
        if (!isNaN(id) && ROAD_TILE_INDICES[id]) {
          for (let s = 0; s < rep && cur + s < total; s++) {
            const ci = cur + s;
            const wx = x0 + (ci % tc) * tw + tw * 0.5;
            const wy = y0 + Math.floor(ci / tc) * th + th * 0.5;
            cells[Math.round(wx / 60) + ',' + Math.round(wy / 60)] = 1;
          }
        }
        cur += rep;
      }
    }

    const keys = Object.keys(cells);
    for (let i = 0; i < keys.length; i++) {
      const p = keys[i].split(',');
      const cx = +p[0], cy = +p[1];
      const right = cells[(cx + 1) + ',' + cy], left = cells[(cx - 1) + ',' + cy];
      const down = cells[cx + ',' + (cy + 1)], up = cells[cx + ',' + (cy - 1)];
      if (right && !left) {
        let e = cx;
        while (cells[(e + 1) + ',' + cy]) e++;
        real.push([cx * 60, cy * 60, e * 60, cy * 60]);
      }
      if (down && !up) {
        let e = cy;
        while (cells[cx + ',' + (e + 1)]) e++;
        real.push([cx * 60, cy * 60, cx * 60, e * 60]);
      }
      if (!right && !left && !down && !up) real.push([cx * 60, cy * 60, cx * 60 + 1, cy * 60]);
    }

    const schematic = [];
    const blkRoads = (data && data.blocks && data.blocks.roads) || [];
    for (let i = 0; i < blkRoads.length; i++) {
      const s = blkRoads[i];
      const a = Math.floor((s[0] - g.originX) / g.cellW) + ',' + Math.floor((s[1] - g.originY) / g.cellH);
      const b = Math.floor((s[2] - 1 - g.originX) / g.cellW) + ',' + Math.floor((s[3] - 1 - g.originY) / g.cellH);
      if (covered[a] && covered[b]) continue;
      schematic.push(s);
    }
    roadNet = { real: real, schematic: schematic };
  }

  function strokeSegments(segs, color, width) {
    if (!segs.length) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      const a = worldToScreen(s[0], s[1]);
      const b = worldToScreen(s[2], s[3]);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }

  function drawOverviewRoads(alpha) {
    if (alpha <= 0) return;
    const w = cam.zoom < 0.03 ? 2 : 3;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    strokeSegments(roadNet.schematic, THEME.roadEdge, w + 2);
    strokeSegments(roadNet.real, THEME.roadEdge, w + 2.5);
    strokeSegments(roadNet.schematic, THEME.dirt, w);
    strokeSegments(roadNet.real, THEME.road, w + 0.5);
    ctx.restore();
  }

  function bakeOverview() {
    if (!mapData) return;
    THEME = isWinterMap(mapData) ? THEME_WINTER : THEME_SUMMER;
    const mw = mapData.width || 17850;
    const mh = mapData.height || 20000;
    overviewScale = Math.min(0.08, OVERVIEW_MAX_DIM / Math.max(mw, mh));
    resizeSurface(overviewLayer, Math.max(64, Math.round(mw * overviewScale)), Math.max(64, Math.round(mh * overviewScale)));
    const o = overviewCtx;
    const m = mapData.__masks || buildTerrainMasks(mapData);
    mapData.__masks = m;
    const cellOnCanvas = m.cellPx * overviewScale;

    o.save();
    o.setTransform(1, 0, 0, 1, 0, 0);
    o.fillStyle = THEME.sea;
    o.fillRect(0, 0, overviewLayer.width, overviewLayer.height);
    o.scale(overviewScale, overviewScale);

    drawMask(o, m.halo, m, 'blur(' + (cellOnCanvas * 2.2).toFixed(1) + 'px)', 0.9);
    drawMask(o, m.water, m);
    drawMask(o, m.land, m, 'drop-shadow(0 0 ' + Math.max(1, cellOnCanvas * 0.25).toFixed(1) + 'px ' + THEME.sand + ')');
    drawMask(o, m.sand, m);
    drawMask(o, m.forest, m, 'blur(0.6px)');
    drawMask(o, m.bunker, m);
    drawMask(o, m.urban, m, 'drop-shadow(0 0 1px ' + THEME.building + ')', THEME.urbanAlpha);
    o.restore();
    invalidate();
  }

  // =========================================================================
  // BAKE DA VISÃO DE SATÉLITE EM OFFSCREENCANVAS (EXECUTADO APENAS NA CARGA!)
  // =========================================================================
  function bakeStaticMap() {
    if (!mapData) return;
    var mw = mapData.width || 17850;
    var mh = mapData.height || 20000;
    staticScale = Math.min(0.15, MAX_STATIC_DIM / Math.max(mw, mh));

    var sw = Math.max(256, Math.round(mw * staticScale));
    var sh = Math.max(256, Math.round(mh * staticScale));
    resizeSurface(staticLayer, sw, sh);
    staticCtx.clearRect(0, 0, staticLayer.width, staticLayer.height);

    staticCtx.save();
    staticCtx.imageSmoothingEnabled = true;
    staticCtx.scale(staticScale, staticScale);

    var isWinter = isWinterMap(mapData);
    const masks = mapData.__masks || buildTerrainMasks(mapData);

    // 1. Oceano
    staticCtx.fillStyle = THEME.sea;
    staticCtx.fillRect(0, 0, mw, mh);

    // 2. Solo base da ilha (textura real tile[6] se carregada) só nas células de terra
    var baseImg = getLoadedImgByName(mapData.baseTileImg);
    if (baseImg && baseImg.width >= 120 && baseImg.height >= 120) {
      var grassTile = createOffscreenSurface(60, 60);
      var gCtx = grassTile.getContext('2d');
      gCtx.drawImage(baseImg, 60, 60, 60, 60, 0, 0, 60, 60);
      staticCtx.fillStyle = staticCtx.createPattern(grassTile, 'repeat') || THEME.field;
      staticCtx.save();
      staticCtx.clip(landPath(masks));
      staticCtx.fillRect(0, 0, mw, mh);
      staticCtx.restore();
    } else {
      drawMask(staticCtx, masks.land, masks);
    }

    // 3. Terreno global (máscaras suavizadas: água, areia, floresta, bunker)
    drawMask(staticCtx, masks.water, masks);
    drawMask(staticCtx, masks.sand, masks);
    drawMask(staticCtx, masks.forest, masks);
    drawMask(staticCtx, masks.bunker, masks);
    // 4. Tiled Backgrounds reais (Água costeira t976, Pontes asfaltadas t974, Heliponto t1002)
    var tbgs = mapData.tiledBgs || [];
    for (var tbi = 0; tbi < tbgs.length; tbi++) {
      var tb = tbgs[tbi];
      var tbImg = getLoadedImgByIdx(tb[0]);
      var tx = tb[1];
      var ty = tb[2];
      var twBg = tb[3];
      var thBg = tb[4];
      var tAng = tb[5] || 0;
      var tOx = typeof tb[6] === 'number' ? tb[6] : 0;
      var tOy = typeof tb[7] === 'number' ? tb[7] : 0;

      staticCtx.save();
      staticCtx.translate(tx, ty);
      if (tAng) staticCtx.rotate(tAng);
      staticCtx.translate(-tOx * twBg, -tOy * thBg);
      if (tbImg) {
        var tbPat = staticCtx.createPattern(tbImg, 'repeat');
        staticCtx.fillStyle = tbPat || '#5c5850';
      } else {
        staticCtx.fillStyle = '#294344';
      }
      staticCtx.fillRect(0, 0, twBg, thBg);
      staticCtx.restore();
    }

    // 3b. Estradas Globais da Matriz Procedural (t518 + t514 + t703) cobrindo 100% da ilha antes do streaming
    var schRoads = roadNet.schematic;
    if (schRoads.length) {
      staticCtx.save();
      staticCtx.lineCap = 'round';
      staticCtx.lineJoin = 'round';

      // Acostamento escuro
      staticCtx.strokeStyle = THEME.roadEdge;
      staticCtx.lineWidth = 148;
      staticCtx.beginPath();
      for (var ri0 = 0; ri0 < schRoads.length; ri0++) {
        var sg0 = schRoads[ri0];
        staticCtx.moveTo(sg0[0], sg0[1]);
        staticCtx.lineTo(sg0[2], sg0[3]);
      }
      staticCtx.stroke();

      // Leito asfaltado/calçado da estrada
      staticCtx.strokeStyle = THEME.dirt;
      staticCtx.lineWidth = 116;
      staticCtx.beginPath();
      for (var ri1 = 0; ri1 < schRoads.length; ri1++) {
        var sg1 = schRoads[ri1];
        staticCtx.moveTo(sg1[0], sg1[1]);
        staticCtx.lineTo(sg1[2], sg1[3]);
      }
      staticCtx.stroke();
      staticCtx.restore();
    }

    // 5. Tilemaps Reais do Construct 2 (Estradas conectadas, Cruzamentos, Praias, Lagos, Florestas)
    drawTilemapList(mapData.tilemaps || []);

    // 6. Muros, Cercas, Barreiras Militares HESCO e Carros Estáticos de Rua
    var props = mapData.props || [];
    for (var pi = 0; pi < props.length; pi++) {
      var pr = props[pi];
      if (!drawSpriteInstance(staticCtx, pr[0], pr[1], pr[2], pr[3], pr[4], pr[5])) {
        staticCtx.save();
        staticCtx.translate(pr[1], pr[2]);
        if (pr[5]) staticCtx.rotate(pr[5]);
        staticCtx.fillStyle = 'rgba(72, 68, 60, 0.85)';
        var pw = Math.abs(pr[3]);
        var ph = Math.abs(pr[4]);
        staticCtx.fillRect(-pw * 0.5, -ph * 0.5, pw, ph);
        staticCtx.restore();
      }
    }

    // 7. Telhados Reais de Todas as Construções + Sombra Aérea + Contorno Tático Sutil
    drawBuildingList(mapData.buildings || []);

    // 8. Copas de Árvores e Blocos de Floresta (alpha 0.90 preserva visibilidade de estradas adjacentes)
    var trees = mapData.trees || [];
    if (trees.length) {
      staticCtx.save();
      staticCtx.globalAlpha = 0.90;
      for (var tri = 0; tri < trees.length; tri++) {
        var tr = trees[tri];
        if (!drawSpriteInstance(staticCtx, tr[0], tr[1], tr[2], tr[3], tr[4], 0)) {
          staticCtx.fillStyle = isWinter ? 'rgba(92, 110, 104, 0.65)' : 'rgba(38, 56, 30, 0.65)';
          staticCtx.beginPath();
          staticCtx.arc(tr[1], tr[2], Math.max(18, Math.abs(tr[3]) * 0.38), 0, Math.PI * 2);
          staticCtx.fill();
        }
      }
      staticCtx.restore();
    }

    // 9. Grade Tática de Coordenadas (A1..P16 / A1..J10) gravada direto no OffscreenCanvas
    var gSpec = getGridSpec();

    // Marca d'água sutil do código de cada quadrante (ex.: A1, F8, J10) no canto superior esquerdo do setor
    staticCtx.font = 'bold 92px Consolas, monospace';
    staticCtx.fillStyle = 'rgba(235, 245, 220, 0.16)';
    staticCtx.textAlign = 'left';
    staticCtx.textBaseline = 'top';
    for (var sc = 0; sc < gSpec.cols; sc++) {
      var colStr = colLetters(sc);
      for (var sr = 0; sr < gSpec.rows; sr++) {
        var sx0 = gSpec.originX + sc * gSpec.cellW + 34;
        var sy0 = gSpec.originY + sr * gSpec.cellH + 28;
        if (sx0 >= 0 && sy0 >= 0 && sx0 < mw - 80 && sy0 < mh - 60) {
          staticCtx.fillText(colStr + (sr + 1), sx0, sy0);
        }
      }
    }

    staticCtx.restore();
    invalidate();
  }

  function drawTilemapList(tms) {
    for (var mi = 0; mi < tms.length; mi++) {
      var tm = tms[mi];
      var tmImgIdx = tm[0];
      var tmImg = getLoadedImgByIdx(tmImgIdx);
      if (!tmImg) continue;

      var tmFn = mapData.images[tmImgIdx] || '';
      var isGroundRoadSheet = tmFn.indexOf('ground_lvl') === 0;

      var mx0 = tm[1];
      var my0 = tm[2];
      var mCols = tm[3];
      var mRows = tm[4];
      var mTw = tm[5] || 60;
      var mTh = tm[6] || 60;
      var rleStr = tm[7];
      var mOx = tm[9] || 0;
      var mOy = tm[10] || 0;
      var mSpx = tm[11] || 0;
      var mSpy = tm[12] || 0;

      var tokens = rleStr.split(',');
      var cellCursor = 0;
      var totalCells = mCols * mRows;

      for (var tk = 0; tk < tokens.length && cellCursor < totalCells; tk++) {
        var tok = tokens[tk];
        if (!tok) continue;

        var xPos = tok.indexOf('x');
        var rep = 1;
        var rest = tok;
        if (xPos > 0) {
          rep = parseInt(tok.substring(0, xPos), 10) || 1;
          rest = tok.substring(xPos + 1);
        }

        var tileId = parseInt(rest, 10);
        if (isNaN(tileId) || tileId < 0) {
          cellCursor += rep;
          continue;
        }

        // Otimização: tile[6] sem flip em ground_lvl*_tilemap já foi preenchido pelo pattern base da ilha!
        var flipH = rest.indexOf('h') >= 0;
        var flipV = rest.indexOf('v') >= 0;
        var flipD = rest.indexOf('d') >= 0;
        if (isGroundRoadSheet && tileId === 6 && !flipH && !flipV && !flipD) {
          cellCursor += rep;
          continue;
        }

        var slice = getTileSliceSurface(tmImgIdx, tmImg, tileId, flipH, flipV, flipD, mTw, mTh, mOx, mOy, mSpx, mSpy);
        var isRoadTile = isGroundRoadSheet && !!ROAD_TILE_INDICES[tileId];

        for (var rStep = 0; rStep < rep && cellCursor < totalCells; rStep++, cellCursor++) {
          if (!slice) continue;
          var tyCell = Math.floor(cellCursor / mCols);
          var txCell = cellCursor % mCols;
          var wx = mx0 + txCell * mTw;
          var wy = my0 + tyCell * mTh;
          staticCtx.drawImage(slice, wx, wy, mTw + 0.75, mTh + 0.75);

          // Realce sutil de contraste aéreo nas estradas para máxima visibilidade no celular
          if (isRoadTile) {
            staticCtx.fillStyle = 'rgba(232, 222, 198, 0.11)';
            staticCtx.fillRect(wx, wy, mTw, mTh);
          }
        }
      }
    }
  }

  function drawBuildingList(blds) {
    var roofFallbackColors = {
      mil: '#4e5d42',
      med: '#5c7c89',
      pol: '#4c5c78',
      fire: '#9e4735',
      gas: '#9c6f38',
      gun: '#68526e',
      ch: '#9e8f68',
      castle: '#8a8579',
      shop: '#7d6b5d',
      barn: '#7c533c',
      gar: '#6b6e6d',
      civ: '#835845',
      deer: '#6d563b',
      pump: '#3f7c99',
      bridge: '#66635b'
    };
    for (var bi = 0; bi < blds.length; bi++) {
      var b = blds[bi];
      var bx = b[0];
      var by = b[1];
      var bw = b[2];
      var bh = b[3];
      var bang = b[4] || 0;
      var bkind = b[5] || 'civ';
      var bsIdx = b[6];
      var absBw = Math.abs(bw);
      var absBh = Math.abs(bh);

      // Sombra projetada no solo para dar relevo de satélite aos telhados
      staticCtx.save();
      staticCtx.translate(bx + 8, by + 10);
      if (bang) staticCtx.rotate(bang);
      staticCtx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      staticCtx.fillRect(-absBw * 0.5, -absBh * 0.5, absBw, absBh);
      staticCtx.restore();

      var drewRoof = drawSpriteInstance(staticCtx, bsIdx, bx, by, bw, bh, bang);
      if (!drewRoof) {
        staticCtx.save();
        staticCtx.translate(bx, by);
        if (bang) staticCtx.rotate(bang);
        staticCtx.fillStyle = roofFallbackColors[bkind] || '#835845';
        staticCtx.fillRect(-absBw * 0.5, -absBh * 0.5, absBw, absBh);
        staticCtx.strokeStyle = 'rgba(18, 18, 16, 0.8)';
        staticCtx.lineWidth = 5;
        staticCtx.strokeRect(-absBw * 0.5, -absBh * 0.5, absBw, absBh);
        staticCtx.restore();
      }

      // Contorno discreto apenas em edifícios especiais para leitura imediata sem poluir telhados
      var lmk = LANDMARK_STYLE[bkind];
      if (lmk && bkind !== 'pump') {
        staticCtx.save();
        staticCtx.translate(bx, by);
        if (bang) staticCtx.rotate(bang);
        staticCtx.strokeStyle = lmk.stroke;
        staticCtx.lineWidth = 6;
        staticCtx.strokeRect(-absBw * 0.5, -absBh * 0.5, absBw, absBh);
        staticCtx.restore();
      }
    }
  }

  // =========================================================================
  // HUD, COORDENADAS E DESPOLUIÇÃO INTELIGENTE DE RÓTULOS (ZOOM / HOVER / TAP)
  // =========================================================================
  function updatePoiCard() {
    const active = selectedPoi || hoveredPoi;
    if (!active) {
      poiCard.style.display = 'none';
      return;
    }
    const distStr = (tickData && tickData.player)
      ? ' • ' + distBearingText(tickData.player.x, tickData.player.y, active.x, active.y) + ' de você'
      : '';
    poiCardTitle.textContent = active.label;
    poiCardTitle.style.color = active.color || '#ffd54f';
    poiCardSub.textContent = 'Setor ' + sectorLabel(active.x, active.y) + distStr;
    poiCard.style.borderColor = active.color || '#ffd54f';
    poiCard.style.display = 'flex';
    positionPoiCard();
  }

  // Card ancorado perto do ponto tocado (acima; abaixo se não couber)
  function positionPoiCard() {
    const active = selectedPoi || hoveredPoi;
    if (!active || poiCard.style.display === 'none') return;
    const s = worldToScreen(active.x, active.y);
    const w = poiCard.offsetWidth;
    const h = poiCard.offsetHeight;
    const maxX = window.innerWidth - panelW - w - 8;
    const x = Math.max(8, Math.min(maxX, s.x - w / 2));
    let y = s.y - h - 22;
    if (y < hudBottom + 6) y = s.y + 22;
    y = Math.max(hudBottom + 6, Math.min((drawerTop || window.innerHeight) - h - 6, y));
    poiCard.style.left = Math.round(x) + 'px';
    poiCard.style.top = Math.round(y) + 'px';
  }

  function vitalLevel(el, v) {
    el.classList.toggle('lvl-ok', v >= 60);
    el.classList.toggle('lvl-warn', v >= 30 && v < 60);
    el.classList.toggle('lvl-bad', v < 30);
  }

  const elXpWrap = document.querySelector('.xp-wrap');
  const elXpFill = document.getElementById('xp-fill');
  const elXpTxt = document.getElementById('xp-txt');
  const elKarma = document.getElementById('v-karma');
  const elKills = document.getElementById('v-kills');
  const elThreat = document.getElementById('v-threat');
  const elNearby = document.getElementById('nearby');
  let nearbyAt = 0;

  // XP vai até perk_cost (custo do próximo perk); karma -11 = ainda não iniciado no jogo
  function updateProgress(p) {
    if (typeof p.xp === 'number') {
      const goal = Math.max(1, p.xpGoal || 100);
      const ready = p.xp >= goal;
      elXpFill.style.width = Math.min(100, (p.xp / goal) * 100).toFixed(1) + '%';
      elXpWrap.classList.toggle('ready', ready);
      elXpTxt.textContent = ready
        ? 'PERK DISPONÍVEL! ' + p.xp + '/' + goal + ' XP'
        : 'XP ' + p.xp + '/' + goal + ' • faltam ' + (goal - p.xp) + (p.perks ? ' • perks ' + p.perks : '');
    }
    if (typeof p.karma === 'number' && !isNaN(p.karma)) {
      const unset = p.karma === -11;
      elKarma.textContent = '☯ ' + (unset ? '--' : (p.karma > 0 ? '+' + p.karma : p.karma));
      elKarma.classList.toggle('karma-good', !unset && p.karma > 0);
      elKarma.classList.toggle('karma-bad', !unset && p.karma < 0);
    }
    if (typeof p.zedKills === 'number') {
      elKills.textContent = '☠ ' + p.zedKills + ' / ' + (p.banditKills || 0);
    }
  }

  function updateThreatAlert(p) {
    let best = null;
    let bestD = Infinity;
    const threats = (tickData && tickData.threats) || [];
    for (let i = 0; i < threats.length; i++) {
      const th = threats[i];
      if (th.kind === 'ally') continue;
      const d = Math.hypot(th.x - p.x, th.y - p.y);
      if (d < bestD) { bestD = d; best = th; }
    }
    if (!best || bestD > 2600) {
      elThreat.style.display = 'none';
      return;
    }
    elThreat.textContent = '⚠ ' + (best.label || 'Ameaça') + ' ' + distBearingText(p.x, p.y, best.x, best.y);
    elThreat.style.display = 'inline-block';
  }

  // Ponto mais próximo de cada categoria útil; toque marca waypoint
  function updateNearby(p) {
    const now = Date.now();
    if (now - nearbyAt < 900 || !elNearby) return;
    nearbyAt = now;
    const cands = [];
    const add = function (key, list, label) {
      let best = null;
      let bestD = Infinity;
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        if (!o || typeof o.x !== 'number') continue;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        if (d < bestD) { bestD = d; best = o; }
      }
      if (best) cands.push({ key: key, x: best.x, y: best.y, d: bestD, name: label || best.label || ICON_STYLE[key].name });
    };
    const md = mapData || {};
    const td = tickData || {};
    const q = td.quest;
    if (q) {
      if (q.target) add('target', [q.target], 'Alvo: ' + (q.target.label || 'missão'));
      add('qitem', q.items || [], 'Item da missão');
      add('quest', q.givers || (q.giver ? [q.giver] : []), 'Sobrevivente (missão)');
    }
    add('secret', md.secrets || []);
    add('bunker', md.bunkers || []);
    add('heli', md.crashes || []);
    add('vehicle', td.vehicles || []);
    add('tent', td.tents || []);
    add('med', landmarks.filter(function (l) { return l.kind === 'med'; }), 'Hospital');
    add('mil', landmarks.filter(function (l) { return l.kind === 'mil'; }), 'Militar');
    add('gas', landmarks.filter(function (l) { return l.kind === 'gas'; }), 'Posto');
    cands.sort(function (a, b) { return a.d - b.d; });

    elNearby.textContent = '';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cands.slice(0, 8).forEach(function (c) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'nb-item';
      const cv = document.createElement('canvas');
      cv.width = 18 * dpr;
      cv.height = 18 * dpr;
      const cx = cv.getContext('2d');
      cx.scale(dpr, dpr);
      drawIconShape(cx, c.key, 9, 9, 6);
      const nm = document.createElement('span');
      nm.className = 'nb-name';
      nm.textContent = c.name;
      const ds = document.createElement('span');
      ds.className = 'nb-dist';
      ds.textContent = distBearingText(p.x, p.y, c.x, c.y);
      b.appendChild(cv);
      b.appendChild(nm);
      b.appendChild(ds);
      b.addEventListener('click', function () {
        placeWaypointAt(c.x, c.y);
      });
      elNearby.appendChild(b);
    });
    if (!cands.length) elNearby.textContent = 'Nada mapeado por perto ainda.';
  }

  function setWait(title, msg, warn) {
    waitTitle.textContent = title;
    waitMsg.textContent = msg;
    waitBanner.classList.toggle('warn', !!warn);
    waitBanner.style.display = 'block';
  }

  function updateHudText() {
    connDot.classList.toggle('online', sseConnected && !!(mapData || tickData));
    const src = (tickData && typeof tickData.islandLevel === 'number') ? tickData : mapData;
    const islNum = (src && typeof src.islandLevel === 'number') ? src.islandLevel
               : (src && typeof src.island === 'number') ? src.island : 1;
    const islName = (src && src.islandName) || '';
    const isl = islNum === 0 ? 'TUTORIAL' : ('ILHA ' + islNum + (islName && islName !== 'Ilha ' + islNum ? ' — ' + islName.toUpperCase() : ''));

    if (!sseConnected && pcSilent) {
      hudTitle.textContent = 'PC SEM RESPOSTA';
      setWait('PC SEM RESPOSTA', 'Confira se o MiniDayZ está aberto, o radar ligado (F1) e se o celular está no mesmo Wi-Fi. Tentando de novo...', true);
    } else if (!mapData && !tickData) {
      hudTitle.textContent = sseConnected ? 'ONLINE • AGUARDANDO PARTIDA' : 'CONECTANDO AO PC...';
      if (sseConnected) setWait('AGUARDANDO PARTIDA', 'Conectado ao PC. Inicie ou carregue uma partida no MiniDayZ; o mapa abre sozinho.');
      else setWait('CONECTANDO AO PC...', 'Procurando o MiniDayZ na rede local.');
    } else if (isMapStale()) {
      setWait(islNum === 0 ? 'CARREGANDO TUTORIAL...' : 'CARREGANDO ILHA ' + islNum + '...', 'Nova ilha detectada. Baixando o mapa do PC.');
    } else {
      waitBanner.style.display = 'none';
    }
    if (!mapData && !tickData) return;

    if (tickData && tickData.player) {
      const p = tickData.player;
      hudTitle.textContent = isl + (p.inBunker ? ' [BUNKER]' : '') + ' • DIA ' + p.day + ' • ' + p.clock;
      elHp.textContent = '❤ ' + p.hp + '%';
      elWt.textContent = '💧 ' + p.water + '%';
      elFd.textContent = '🥫 ' + p.food + '%';
      vitalLevel(elHp, p.hp);
      vitalLevel(elWt, p.water);
      vitalLevel(elFd, p.food);
      elTm.textContent = '🌡 ' + (p.temp > 0 ? '+' + p.temp : p.temp);
      elPos.textContent = 'SETOR ' + sectorLabel(p.x, p.y) + ' • ' + cardinal(bearingDeg(Math.cos(p.angle || 0), Math.sin(p.angle || 0)));
      updateProgress(p);
      updateThreatAlert(p);
      updateNearby(p);
      if (elQst) {
        if (tickData.quest && tickData.quest.status >= 1 && tickData.quest.status <= 4) {
          elQst.textContent = '📜 ' + (tickData.quest.taskTitle || 'Missão Ativa');
          elQst.style.display = 'inline-block';
        } else {
          elQst.style.display = 'none';
        }
      }
    } else {
      hudTitle.textContent = isl + ' • MAPA PRONTO';
    }
    if (isMapStale()) hudTitle.textContent = 'CARREGANDO NOVA ILHA...';
    btnClearWp.style.display = waypoint ? 'block' : 'none';
    updatePoiCard();
    updateFilterCounts();
    measureChrome();
    invalidate();
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx - cam.x) * cam.zoom + (window.innerWidth - panelW) * 0.5,
      y: (wy - cam.y) * cam.zoom + window.innerHeight * 0.5
    };
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx - (window.innerWidth - panelW) * 0.5) / cam.zoom + cam.x,
      y: (sy - window.innerHeight * 0.5) / cam.zoom + cam.y
    };
  }
  function isSameTarget(a, b) {
    if (!a || !b) return false;
    return a.label === b.label && Math.abs(a.x - b.x) <= 8 && Math.abs(a.y - b.y) <= 8;
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    var rot = Math.PI / 2 * 3;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (var i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.closePath();
  }

  const textWCache = new Map();

  // Largura de texto cacheada por fonte+string (ctx.font já deve estar setado com a mesma fonte)
  function textW(font, text) {
    const k = font + '|' + text;
    let w = textWCache.get(k);
    if (w === undefined) {
      if (textWCache.size > 4000) textWCache.clear();
      w = ctx.measureText(text).width;
      textWCache.set(k, w);
    }
    return w;
  }

  // Renderiza caixa de texto somente se não colidir com outro rótulo já posicionado na tela
  function tryDrawLabelBox(sx, sy, text, color, placedRects, forceShow) {
    const font = 'bold 10.5px Consolas, "Segoe UI", monospace';
    ctx.font = font;
    var tw = Math.ceil(textW(font, text)) + 12;
    var th = 16;
    var rx = Math.round(sx - tw * 0.5);
    var ry = Math.round(sy + 12);

    if (!forceShow) {
      for (var i = 0; i < placedRects.length; i++) {
        var r = placedRects[i];
        if (rx < r.x + r.w + 4 && rx + tw + 4 > r.x && ry < r.y + r.h + 3 && ry + th + 3 > r.y) {
          return false;
        }
      }
    }

    placedRects.push({ x: rx, y: ry, w: tw, h: th });
    ctx.fillStyle = 'rgba(10, 15, 12, 0.90)';
    ctx.fillRect(rx, ry, tw, th);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    ctx.strokeRect(rx, ry, tw, th);
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, sx, ry + th * 0.5 + 0.5);
    return true;
  }

  function playerCell(g) {
    if (!tickData || !tickData.player) return null;
    const cx = Math.floor((tickData.player.x - g.originX) / g.cellW);
    const cy = Math.floor((tickData.player.y - g.originY) / g.cellH);
    return (cx >= 0 && cy >= 0 && cx < g.cols && cy < g.rows) ? { c: cx, r: cy } : null;
  }

  function drawGridLines(vw, vh) {
    if (!mapData) return;
    const g = getGridSpec();
    const tl = worldToScreen(g.originX, g.originY);
    const cw = g.cellW * cam.zoom;
    const ch = g.cellH * cam.zoom;
    const x1 = tl.x + g.cols * cw;
    const y1 = tl.y + g.rows * ch;
    const a = cam.zoom < ISLAND_ZOOM ? 0.38 : 0.22;

    ctx.strokeStyle = 'rgba(240, 246, 225, ' + a + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= g.cols; c++) {
      const x = Math.round(tl.x + c * cw) + 0.5;
      if (x < -1 || x > vw + 1) continue;
      ctx.moveTo(x, Math.max(0, tl.y));
      ctx.lineTo(x, Math.min(vh, y1));
    }
    for (let r = 0; r <= g.rows; r++) {
      const y = Math.round(tl.y + r * ch) + 0.5;
      if (y < -1 || y > vh + 1) continue;
      ctx.moveTo(Math.max(0, tl.x), y);
      ctx.lineTo(Math.min(vw, x1), y);
    }
    ctx.stroke();

    const pc = playerCell(g);
    if (pc) {
      const sx = tl.x + pc.c * cw;
      const sy = tl.y + pc.r * ch;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.fillRect(sx, sy, cw, ch);
      ctx.strokeStyle = 'rgba(255, 213, 79, 0.75)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx + 0.5, sy + 0.5, cw - 1, ch - 1);
    }
  }

  // Réguas coladas na borda do mapa (presas na tela quando o mapa passa da borda)
  function drawStickyGridRulers(vw, vh) {
    if (!mapData) return;
    const g = getGridSpec();
    const tl = worldToScreen(g.originX, g.originY);
    const cw = g.cellW * cam.zoom;
    const ch = g.cellH * cam.zoom;
    const pc = playerCell(g);
    const bottomLimit = Math.min(vh, drawerTop || vh) - 12;
    const topY = Math.max(hudBottom + 10, Math.min(bottomLimit - 30, tl.y - 10));
    const leftX = Math.max(11, Math.min(vw - 11, tl.x - 12));

    ctx.font = 'bold 10px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let c = 0; c < g.cols; c++) {
      const sx = tl.x + (c + 0.5) * cw;
      if (sx < leftX + 16 || sx > vw - 10) continue;
      const cur = pc && pc.c === c;
      ctx.fillStyle = cur ? 'rgba(255, 213, 79, 0.95)' : 'rgba(11, 16, 13, 0.80)';
      ctx.fillRect(sx - 10, topY - 8, 20, 16);
      ctx.fillStyle = cur ? '#1a1400' : '#dce775';
      ctx.fillText(colLetters(c), sx, topY + 0.5);
    }
    for (let r = 0; r < g.rows; r++) {
      const sy = tl.y + (r + 0.5) * ch;
      if (sy < topY + 14 || sy > bottomLimit) continue;
      const cur = pc && pc.r === r;
      ctx.fillStyle = cur ? 'rgba(255, 213, 79, 0.95)' : 'rgba(11, 16, 13, 0.80)';
      ctx.fillRect(leftX - 10, sy - 8, 20, 16);
      ctx.fillStyle = cur ? '#1a1400' : '#cfe0b8';
      ctx.fillText(String(r + 1), leftX, sy + 0.5);
    }
  }

  function drawPlaceNames(vw, vh) {
    if (!placeNames.length || cam.zoom >= LABEL_ZOOM_THRESHOLD) return;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '1.5px';
    const placed = [];
    for (let i = 0; i < placeNames.length; i++) {
      const pn = placeNames[i];
      const s = worldToScreen(pn.x, pn.y);
      if (s.x < -80 || s.y < -20 || s.x > vw + 80 || s.y > vh + 20) continue;
      const pnFont = '700 ' + pn.size + 'px "Segoe UI", system-ui, sans-serif';
      ctx.font = pnFont;
      const w = textW('ls1.5|' + pnFont, pn.text);
      const h = pn.size + 4;
      let hit = false;
      for (let k = 0; k < placed.length; k++) {
        const r = placed[k];
        if (s.x - w / 2 < r.x + r.w && s.x + w / 2 > r.x && s.y - h / 2 < r.y + r.h && s.y + h / 2 > r.y) { hit = true; break; }
      }
      if (hit) continue;
      placed.push({ x: s.x - w / 2, y: s.y - h / 2, w: w, h: h });
      ctx.strokeStyle = 'rgba(8, 12, 10, 0.88)';
      ctx.lineWidth = 3.5;
      ctx.strokeText(pn.text, s.x, s.y);
      ctx.fillStyle = '#f6efd8';
      ctx.fillText(pn.text, s.x, s.y);
    }
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function drawTrail() {
    if (trail.length < 2) return;
    const now = Date.now();
    ctx.lineWidth = 2.2;
    ctx.setLineDash([5, 5]);
    let prev = worldToScreen(trail[0].x, trail[0].y);
    for (let i = 1; i < trail.length; i++) {
      const cur = worldToScreen(trail[i].x, trail[i].y);
      const age = (now - trail[i].t) / TRAIL_MAX_MS;
      ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.08 + 0.62 * (1 - age)).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(cur.x, cur.y);
      ctx.stroke();
      prev = cur;
    }
    ctx.setLineDash([]);
  }

  function drawPlayer(pl, pulse) {
    const ps = worldToScreen(pl.x, pl.y);
