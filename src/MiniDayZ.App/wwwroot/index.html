<head>

	<link rel="manifest" href="appmanifest.json" />
	
	<!-- Allow fullscreen mode on iOS devices. (These are Apple specific meta tags.) -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />
	<meta name="HandheldFriendly" content="true" />
	
	<!-- Chrome for Android web app tags -->
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="shortcut icon" sizes="256x256" href="icon-256.png" />

    <!-- All margins and padding must be zero for the canvas to fill the screen. -->
	<style type="text/css">
		* {
			padding: 0;
			margin: 0;
		}
		html, body {
			background: #000;
			color: #fff;
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
		}
		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
    </style>
	

	<!-- MiniDayZ PC Port: saves via IPC (localStorage <-> %LOCALAPPDATA%\MiniDayZ\Saves). Deve rodar ANTES do c2runtime. -->
	<script>
	  (function () {
	    if (!(window.chrome && window.chrome.webview)) return;

	    var ipc = window.chrome.webview;
	    var ls;
	    try { ls = window.localStorage; } catch (e) { return; }

	    var proto = Storage.prototype;
	    var nativeGet = proto.getItem, nativeSet = proto.setItem,
	        nativeRemove = proto.removeItem, nativeClear = proto.clear, nativeKey = proto.key;
	    var has = Object.prototype.hasOwnProperty;

	    // Cache síncrono hidratado pelo C# (AddScriptToExecuteOnDocumentCreated) antes deste script.
	    var disk = window.__MDZ_SAVES__ || {};
	    var requested = {};
	    var pending = {};

	    // Restaura no localStorage nativo o que existe no disco e foi perdido (perfil limpo/corrompido).
	    for (var k in disk) {
	      if (has.call(disk, k) && nativeGet.call(ls, k) === null) {
	        try { nativeSet.call(ls, k, disk[k]); } catch (e) { }
	      }
	    }

	    proto.setItem = function (key, value) {
	      if (this === ls) {
	        key = String(key); value = String(value);
	        disk[key] = value;
	        ipc.postMessage({ action: 'save', key: key, data: value });
	      }
	      return nativeSet.call(this, key, value);
	    };

	    proto.getItem = function (key) {
	      var value = nativeGet.call(this, key);
	      if (this === ls) {
	        key = String(key);
	        if (value === null && has.call(disk, key)) value = disk[key];
	        if (value === null && !requested[key]) {
	          requested[key] = true;
	          ipc.postMessage({ action: 'load', key: key });
	        }
	      }
	      return value;
	    };

	    proto.removeItem = function (key) {
	      if (this === ls) {
	        key = String(key);
	        delete disk[key];
	        ipc.postMessage({ action: 'delete', key: key });
	      }
	      return nativeRemove.call(this, key);
	    };

	    proto.clear = function () {
	      if (this === ls) {
	        var keys = Object.keys(disk);
	        for (var i = 0; i < ls.length; i++) keys.push(nativeKey.call(ls, i));
	        keys.forEach(function (key) {
	          if (key !== null) ipc.postMessage({ action: 'delete', key: key });
	        });
	        disk = {};
	      }
	      return nativeClear.call(this);
	    };

	    // Resposta assíncrona do C# para action "load".
	    window.addEventListener('SaveLoaded', function (e) {
	      var d = e.detail || {};
	      if (typeof d.key !== 'string') return;

	      if (typeof d.data === 'string') {
	        disk[d.key] = d.data;
	        try { nativeSet.call(ls, d.key, d.data); } catch (err) { }
	      }

	      var callbacks = pending[d.key];
	      if (callbacks) {
	        delete pending[d.key];
	        callbacks.forEach(function (cb) { cb(typeof d.data === 'string' ? d.data : null); });
	      }
	    });

	    // API assíncrona explícita: MDZSaves.load('chave').then(data => ...)
	    window.MDZSaves = {
	      load: function (key) {
	        key = String(key);
	        return new Promise(function (resolve) {
	          (pending[key] = pending[key] || []).push(resolve);
	          ipc.postMessage({ action: 'load', key: key });
	        });
	      }
	    };
	  })();
	</script>

	<!-- MiniDayZ PC Port: remove a "cara de navegador" -->
	<style>
	  body, html { overflow: hidden; user-select: none; -webkit-user-drag: none; touch-action: none; }
	  img { pointer-events: none; }
	</style>

	<!-- MiniDayZ PC Port: bloqueia menu de contexto + teste IPC (JS -> C#) -->
	<script>
	  document.addEventListener('contextmenu', event => event.preventDefault());
	  window.addEventListener('load', () => {
	     if (window.chrome && window.chrome.webview) {
	         window.chrome.webview.postMessage("TestIPC_Success");
	     }
	  });
	</script>
</head> 
 
<body> 
	<div id="fb-root"></div>
	
	<div id="c2canvasdiv">
	
		<!-- The canvas the project will render to.  If you change its ID, don't forget to change the
		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->
		<canvas id="c2canvas" width="1024" height="768">
			<!-- This text is displayed if the visitor's browser does not support HTML5.
			You can change it, but it is a good idea to link to a description of a browser
			and provide some links to download some popular HTML5-compatible browsers. -->
			<h1>Your browser does not appear to support HTML5.  Try upgrading your browser to the latest version.  <a href="http://www.whatbrowser.org">What is a browser?</a>
			<br/><br/><a href="http://www.microsoft.com/windows/internet-explorer/default.aspx">Microsoft Internet Explorer</a><br/>
			<a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br/>
			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>
			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>
		</canvas>
		
	</div>
	
	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->
	<script src="jquery-3.4.1.min.js"></script>


	
    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			cr_createRuntime("c2canvas");
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
    <!-- Módulo Isolado de Controles PC (Teclado + Aba Visual de Controles [F1]) -->
    <script id="pc-keybinds" src="controls/pc-controls.js"></script>
</body> 
</html>
